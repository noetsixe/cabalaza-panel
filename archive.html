<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Institution Archive</title>
    
    <!-- Tipografías de Prestigio Institucional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'med-navy': '#061329',      // Azul institucional profundo
                        'med-blue': '#0284C7',      // Azul médico clínico
                        'med-cyan': '#0EA5E9',      // Celeste brillante
                        'med-gold': '#D97706',      // Dorado prestigioso
                        'med-surface': '#FFFFFF',   // Blanco para tarjetas
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: #F0F4F8;
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(217, 119, 6, 0.05) 0px, transparent 40%),
                radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.06) 0px, transparent 50%),
                linear-gradient(to right, rgba(0, 0, 0, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Tarjeta Institucional de Cristal Refinado */
        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 
                0 20px 40px -15px rgba(6, 19, 41, 0.07),
                0 0 0 1px rgba(2, 132, 199, 0.08);
            transition: transform 0.5s var(--ease-fluid), box-shadow 0.5s var(--ease-fluid), border-color 0.5s var(--ease-fluid);
        }

        .glass-card:hover {
            box-shadow: 
                0 30px 60px -20px rgba(2, 132, 199, 0.18),
                0 0 0 1px rgba(2, 132, 199, 0.3);
            transform: translateY(-6px);
        }

        /* Alternativas con micro-interacciones fluidas */
        .alternativa {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.4s var(--ease-fluid);
            font-size: 15px;
            color: #1E293B;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .alternativa::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #0284C7;
            opacity: 0;
            transition: opacity 0.3s var(--ease-fluid);
        }

        .alternativa:hover:not(.bloqueada) {
            background: #FFFFFF;
            border-color: rgba(2, 132, 199, 0.4);
            color: #061329;
            box-shadow: 0 8px 25px -5px rgba(2, 132, 199, 0.12);
            transform: translateX(6px);
        }

        .alternativa:hover:not(.bloqueada)::before {
            opacity: 1;
        }

        .alternativa.correcta {
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
            border-color: #10B981;
            color: #065F46;
            font-weight: 600;
            box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.2);
        }
        .alternativa.correcta::before {
            background: #10B981;
            opacity: 1;
        }

        .alternativa.incorrecta {
            background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
            border-color: #EF4444;
            color: #991B1B;
            box-shadow: 0 8px 20px -5px rgba(239, 68, 68, 0.2);
        }
        .alternativa.incorrecta::before {
            background: #EF4444;
            opacity: 1;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Panel de respuesta expandible super fluido */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s var(--ease-fluid), opacity 0.6s var(--ease-fluid), margin-top 0.6s var(--ease-fluid);
            opacity: 0;
            margin-top: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }

        /* Inputs estilizados para edición institucional */
        .input-clinico {
            background: transparent;
            border-bottom: 2px solid rgba(2, 132, 199, 0.2);
            color: #061329;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            outline: none;
            width: 100%;
            transition: all 0.3s var(--ease-fluid);
        }

        .input-clinico:focus, .input-clinico:hover {
            border-bottom-color: #0284C7;
            background: rgba(2, 132, 199, 0.02);
        }

        .input-sub {
            background: transparent;
            border-bottom: 1px solid rgba(15, 23, 42, 0.15);
            color: #0284C7;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            outline: none;
            width: 100%;
            transition: all 0.3s var(--ease-fluid);
        }

        .input-sub:focus, .input-sub:hover {
            border-bottom-color: #0284C7;
        }

        /* Animación suave de entrada escalonada */
        @keyframes fadeUpEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fade-up {
            animation: fadeUpEntrance 0.8s var(--ease-fluid) forwards;
            opacity: 0;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(2, 132, 199, 0.15); }
            50% { box-shadow: 0 0 35px rgba(2, 132, 199, 0.3); }
        }
        .animate-glow { animation: pulseGlow 4s infinite ease-in-out; }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-16">

<div class="max-w-6xl mx-auto space-y-12">
    
    <!-- Encabezado Institucional de Lux -->
    <header class="glass-card p-8 md:p-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 animate-fade-up animate-glow relative overflow-hidden">
        <div class="absolute -top-12 -left-12 w-40 h-40 bg-sky-200/40 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="flex items-center gap-6 z-10">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-med-navy to-slate-800 flex items-center justify-center shadow-xl shadow-med-navy/20 border border-slate-700/50">
                <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <p class="text-med-blue tracking-[0.25em] text-[11px] font-bold uppercase">Repositorio Médico Académico</p>
                </div>
                <h1 class="text-3xl md:text-5xl font-serif text-med-navy tracking-tight font-bold">Atlas Clínico</h1>
            </div>
        </div>

        <a href="index.html" class="z-10 bg-gradient-to-r from-med-navy to-slate-800 hover:from-slate-800 hover:to-med-navy text-white text-xs font-bold tracking-widest uppercase px-6 py-4 rounded-xl shadow-lg shadow-med-navy/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center gap-3">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- Grid de Exámenes -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-24 text-med-blue font-serif italic text-2xl animate-pulse">
            Accediendo a los expedientes institucionales...
        </div>
    </div>

    <!-- Vista de Preguntas -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-xl">No hay expedientes en el archivo institucional.</div>';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="glass-card p-8 flex flex-col justify-between h-72 group animate-fade-up relative overflow-hidden" style="animation-delay: ${index * 0.08}s">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-sky-100/50 to-transparent rounded-bl-full -mr-8 -mt-8 pointer-events-none transition-all group-hover:scale-110"></div>
                
                <div class="flex justify-between items-start mb-4 z-10">
                    <div class="w-12 h-12 rounded-2xl bg-sky-50 border border-sky-100 flex items-center justify-center text-med-blue shadow-sm group-hover:scale-105 transition-transform">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="bg-gradient-to-r from-sky-500 to-med-blue text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-md shadow-sky-500/20">${data.total} reactivos</span>
                </div>

                <div class="flex-1 mb-4 space-y-2 z-10">
                    <div class="flex items-center gap-2">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-clinico" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                        <svg class="w-3.5 h-3.5 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <p class="text-[11px] font-bold text-slate-400 pt-1 uppercase tracking-wider">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="z-10 w-full bg-gradient-to-r from-med-navy via-slate-800 to-med-navy hover:from-med-blue hover:to-sky-600 text-white text-xs font-bold uppercase tracking-widest py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <span>Abrir Expediente</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos institucional.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Error al guardar');
        
        const input = document.getElementById(`${tipo}-${grupoId}`);
        input.classList.add('text-emerald-600');
        setTimeout(() => input.classList.remove('text-emerald-600'), 1000);

    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-24 text-med-blue font-serif italic text-2xl animate-pulse">Desplegando cuestionario clínico...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-med-navy text-xs font-bold tracking-widest uppercase px-6 py-3.5 rounded-xl shadow-md border border-slate-200 transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
                <svg class="w-4 h-4 text-med-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a la selección
            </button>
        </div>
        
        <div class="glass-card p-8 md:p-10 mb-10 border-l-8 border-l-med-blue animate-fade-up relative overflow-hidden">
            <div class="flex items-center gap-3 mb-2">
                <span class="px-3 py-1 bg-sky-100 text-med-blue text-[10px] font-bold tracking-widest uppercase rounded-md">Expediente Oficial</span>
            </div>
            <h2 class="text-3xl md:text-4xl font-serif text-med-navy font-bold">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-med-blue mt-2 text-xs font-bold tracking-widest uppercase">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} Reactivos Clínicos</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="glass-card p-8 md:p-12 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-8 flex gap-5 items-start">
                        <span class="w-10 h-10 rounded-xl bg-med-navy text-white font-serif font-bold text-lg flex items-center justify-center shrink-0 shadow-md">Q${i + 1}</span>
                        <h3 class="text-lg md:text-xl text-med-navy font-semibold leading-relaxed pt-1">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3.5 mt-8 pl-0 md:pl-15">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-med-blue font-bold text-base mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span class="leading-relaxed">${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-slate-200/80 flex justify-end pl-0 md:pl-15">
                        <button onclick="verCorrecta('p${i}')" class="text-xs font-bold tracking-widest text-med-blue hover:text-sky-700 uppercase transition-all flex items-center gap-2 bg-sky-50 hover:bg-sky-100 px-5 py-2.5 rounded-xl border border-sky-100 shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-15" id="panel-p${i}">
                        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-300/80 p-6 rounded-2xl flex items-start gap-4 shadow-md">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0 shadow-md">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h4 class="text-emerald-800 font-bold text-xs tracking-widest uppercase mb-1">Fundamento / Respuesta Correcta</h4>
                                <p class="text-emerald-950 font-serif text-lg font-semibold">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
