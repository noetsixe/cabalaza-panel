<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'zen-bg': '#f8fafc',       // Blanco puro con un toque de gris
                        'zen-text': '#1e293b',     // Azul oscuro profundo
                        'zen-cyan': '#0284c7',     // Celeste médico
                        'zen-line': '#e2e8f0',     // Gris claro para líneas
                        'zen-accent': '#f0f9ff',   // Fondo celeste muy suave
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                        'jp': ['Noto Serif JP', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(90deg, rgba(226, 232, 240, 0.3) 1px, transparent 1px),
                linear-gradient(rgba(226, 232, 240, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #1e293b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Animación de levitación para el símbolo médico */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .animate-float {
            animation: float-slow 5s ease-in-out infinite;
        }

        /* Animación de entrada escalonada */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Tarjetas estilo japonés: bordes ultra finos, sin sombras toscas */
        .zen-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px; /* Bordes sutiles */
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.03);
        }

        .zen-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: #0284c7;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.5s ease;
        }

        .zen-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
            transform: translateY(-3px);
        }

        .zen-card:hover::before {
            transform: scaleY(1);
        }

        /* Alternativas */
        .alternativa {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 18px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: #334155;
            font-weight: 500;
        }

        .alternativa:hover:not(.bloqueada) {
            background: #f0f9ff;
            border-color: #0284c7;
            color: #0284c7;
            padding-left: 32px; /* Pequeño efecto de desplazamiento */
        }

        .alternativa.correcta {
            background: #ecfdf5;
            border-color: #10b981;
            color: #047857;
            font-weight: 600;
        }

        .alternativa.incorrecta {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Inputs estilo expediente */
        .input-zen {
            background: transparent;
            border-bottom: 1px solid transparent;
            color: #1e293b;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-zen:hover, .input-zen:focus {
            border-bottom: 1px solid #0284c7;
        }

        .input-zen-sub {
            background: transparent;
            border-bottom: 1px solid transparent;
            color: #0284c7;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-zen-sub:hover, .input-zen-sub:focus {
            border-bottom: 1px solid #0284c7;
        }

        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }
    </style>
</head>
<body class="p-6 md:p-12">

<div class="max-w-6xl mx-auto space-y-12">
    
    <!-- HEADER ESTILO JAPONÉS/MÉDICO -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 pb-8 border-b border-zen-line animate-fade-up">
        <div class="flex items-center gap-6">
            <!-- Símbolo Médico Flotante -->
            <div class="w-20 h-20 rounded-full bg-white border border-zen-line flex items-center justify-center shadow-sm animate-float relative">
                <div class="absolute inset-0 rounded-full border border-zen-cyan/20 animate-ping opacity-20"></div>
                <svg class="w-8 h-8 text-zen-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
            </div>
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-zen-cyan tracking-[0.2em] text-[10px] font-bold uppercase">Clinical Archive</span>
                    <span class="h-px w-8 bg-zen-cyan"></span>
                    <span class="text-slate-400 tracking-[0.2em] text-[10px] font-bold uppercase font-jp">記録</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-serif text-zen-text tracking-tight">Atlas Médico</h1>
                <p class="text-slate-500 text-sm mt-2 font-medium">Repositorio de exámenes y prácticas clínicas.</p>
            </div>
        </div>
        <a href="index.html" class="bg-white hover:bg-slate-50 text-zen-text text-sm font-semibold px-6 py-3 rounded-sm border border-zen-line transition-all flex items-center gap-2 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- DASHBOARD (Para que no se sienta vacío) -->
    <div id="dashboard-stats" class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-up" style="animation-delay: 0.1s">
        <!-- Se llena con JS -->
    </div>

    <!-- TÍTULO DE SECCIÓN -->
    <div class="flex items-center justify-between mt-12 mb-6 animate-fade-up" style="animation-delay: 0.2s">
        <h2 class="text-xl font-serif text-zen-text">Expedientes Registrados</h2>
        <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">Archivos Recientes</span>
    </div>

    <!-- GRID DE EXÁMENES -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 text-zen-cyan font-serif italic text-lg animate-pulse">
            Cargando expedientes...
        </div>
    </div>

    <!-- VISTA DE PREGUNTAS -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-lg">El archivo está vacío. Realiza un examen para comenzar.</div>';
            document.getElementById('dashboard-stats').innerHTML = '';
            return;
        }

        // Agrupar
        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        // Rellenar Dashboard
        document.getElementById('dashboard-stats').innerHTML = `
            <div class="zen-card p-6 flex flex-col justify-center">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">Total Preguntas</span>
                <span class="text-3xl font-serif text-zen-text">${preguntas.length}</span>
            </div>
            <div class="zen-card p-6 flex flex-col justify-center">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">Expedientes</span>
                <span class="text-3xl font-serif text-zen-text">${Object.keys(grupos).length}</span>
            </div>
            <div class="zen-card p-6 flex flex-col justify-center">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">Estado del Sistema</span>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-sm font-bold text-emerald-600 tracking-wide uppercase">En Línea</span>
                </div>
            </div>
        `;

        // Rellenar Grid
        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="zen-card p-6 flex flex-col justify-between h-56 group animate-fade-up" style="animation-delay: ${(index * 0.1) + 0.3}s">
                
                <div class="flex justify-between items-start mb-4">
                    <div class="text-zen-cyan">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase border border-zen-line px-2 py-1 rounded-sm bg-slate-50">${data.total} Preguntas</span>
                </div>

                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-zen" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-zen-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                    </div>
                    <p class="text-[10px] font-medium text-slate-400 mt-4 uppercase tracking-widest">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full bg-zen-text hover:bg-zen-cyan text-white text-xs font-bold py-3 rounded-sm tracking-widest uppercase transition-colors">
                    Revisar Expediente
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Error');
    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    document.getElementById('dashboard-stats').classList.add('hidden');
    // Ocultar el título de sección
    document.querySelectorAll('.flex.items-center.justify-between.mt-12.mb-6')[0].classList.add('hidden');
    
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-zen-cyan font-serif italic text-lg animate-pulse">Abriendo expediente clínico...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-10 animate-fade-up">
            <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-zen-text text-xs font-bold uppercase tracking-widest px-6 py-3 rounded-sm border border-zen-line transition-all flex items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver al Archivo
            </button>
        </div>
        
        <div class="mb-12 border-l-2 border-zen-cyan pl-6 animate-fade-up">
            <h2 class="text-4xl font-serif text-zen-text">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-slate-500 mt-3 text-sm font-medium tracking-wide">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} preguntas documentadas</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="zen-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6 flex gap-4">
                        <span class="text-zen-cyan font-serif italic text-2xl mt-1">Q${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-zen-text font-medium leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-zen-cyan font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-zen-line flex justify-end pl-0 md:pl-12">
                        <button onclick="verCorrecta('p${i}')" class="text-[10px] font-bold tracking-widest text-zen-cyan hover:text-white uppercase transition-colors flex items-center gap-2 bg-transparent hover:bg-zen-cyan px-4 py-2 rounded-sm border border-zen-cyan">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar Respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-12" id="panel-p${i}">
                        <div class="bg-emerald-50 border border-emerald-100 p-6 rounded-sm flex items-start gap-4">
                            <svg class="w-5 h-5 text-emerald-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-emerald-700 font-bold text-xs tracking-widest uppercase mb-1">Respuesta Correcta</h4>
                                <p class="text-emerald-900 font-serif text-lg">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
