    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'med-bg': 'var(--med-bg)',
                        'med-blue': 'var(--med-blue)',
                        'med-jade': 'var(--med-jade)',
                        'med-text': 'var(--med-text)',
                        'med-border': 'var(--med-border)',
                        'med-card': 'var(--med-card)',
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --med-bg: #f9fbff;
            --med-blue: #0b132b;
            --med-jade: #319795;
            --med-text: #1e293b;
            --med-border: #e2e8f0;
            --med-card: #ffffff;
        }

        /* MODO OSCURO */
        body.dark-mode {
            --med-bg: #0f172a;
            --med-blue: #e2e8f0;
            --med-jade: #38b2ac;
            --med-text: #f8fafc;
            --med-border: #334155;
            --med-card: #1e293b;
        }

        body {
            background-color: var(--med-bg);
            color: var(--med-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: radial-gradient(circle at 50% 0%, var(--med-card) 0%, var(--med-bg) 80%);
        }

        .med-card, header, .bg-white {
            background-color: var(--med-card) !important;
            border-color: var(--med-border) !important;
            color: var(--med-text) !important;
        }

        .border-med-border { border-color: var(--med-border) !important; }
        .border-med-jade { border-color: var(--med-jade) !important; }
        .text-med-blue { color: var(--med-blue) !important; }
        .text-med-jade { color: var(--med-jade) !important; }
        .text-slate-500, .text-slate-400 { color: var(--med-text) !important; opacity: 0.7; }

        /* Animaciones */
        @keyframes float-med { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float-med 5s ease-in-out infinite; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .med-card {
            border: 1px solid var(--med-border);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
        }
        .med-card:hover {
            transform: translateY(-5px);
            border-color: var(--med-jade);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        /* Alternativas */
        .alternativa {
            background: var(--med-card);
            border: 1px solid var(--med-border);
            border-radius: 8px;
            padding: 18px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: var(--med-text);
            font-weight: 500;
        }
        .alternativa:hover:not(.bloqueada) { background: var(--med-bg); border-color: var(--med-jade); }
        .alternativa.correcta { background: #e6fffa; border-color: #319795; color: #234e52; font-weight: 600; }
        body.dark-mode .alternativa.correcta { background: rgba(49, 151, 149, 0.2); color: #81e6d9; }
        .alternativa.incorrecta { background: #fff5f5; border-color: #e53e3e; color: #742a2a; }
        body.dark-mode .alternativa.incorrecta { background: rgba(229, 62, 62, 0.2); color: #feb2b2; }
        .alternativa.bloqueada { cursor: default; }

        /* Inputs */
        .input-med { background: transparent; border-bottom: 2px dashed transparent; color: var(--med-text); font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; outline: none; width: 100%; transition: all 0.3s; }
        .input-med:hover, .input-med:focus { border-bottom: 2px dashed var(--med-jade); }
        .input-med-sub { background: transparent; border-bottom: 1px solid transparent; color: var(--med-jade); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; outline: none; width: 100%; transition: all 0.3s; }
        .input-med-sub:hover, .input-med-sub:focus { border-bottom: 1px solid var(--med-blue); }

        /* Panel respuesta */
        .panel-correcta { max-height: 0; overflow: hidden; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; }
        .panel-correcta.abierto { max-height: 400px; opacity: 1; margin-top: 24px; }

        /* Modo Simulador (Fullscreen) */
        #modo-simulador {

    localStorage.setItem('darkMode', isDark);
    document.getElementById('icon-dark').innerHTML = isDark 
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
}

if (localStorage.getItem('darkMode') === 'true') {
    toggleDarkMode();
}

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-lg bg-white border border-med-border rounded-xl">El archivo está vacío.</div>';
            document.getElementById('dashboard-stats').innerHTML = '';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { id: id, total: 0, nombre: p.nombre_personalizado || 'Examen sin título', materia: p.materia_personalizada || p.materia || 'General', fecha: new Date().toLocaleDateString() };
            }
            grupos[id].total++;
        });

        document.getElementById('dashboard-stats').innerHTML = `
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-med-blue">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Total Preguntas</span>
                <span class="text-3xl font-serif text-med-blue font-bold">${preguntas.length}</span>
            </div>
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-med-jade">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Expedientes</span>
                <span class="text-3xl font-serif text-med-blue font-bold">${Object.keys(grupos).length}</span>
            </div>
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-slate-400">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Estado del Sistema</span>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-med-jade animate-pulse"></span>
                    <span class="text-sm font-bold text-med-jade tracking-wide uppercase">En Línea</span>
                </div>
            </div>
        `;

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="med-card p-6 flex flex-col justify-between h-64 group animate-fade-up relative" style="animation-delay: ${(index * 0.1) + 0.3}s">
                
                <!-- Botón Eliminar (Esquina superior derecha) -->
                <button onclick="eliminarExpediente('${id}')" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors p-2" title="Eliminar expediente">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-4 pr-10">
                    <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-med-blue">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-bold tracking-widest text-med-blue bg-slate-50 border border-slate-200 px-3 py-1 rounded-sm">${data.total} PREGUNTAS</span>
                </div>

                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" class="input-med" placeholder="Nombre del examen" onchange="guardarTitulo('${id}', this.value, 'nombre')">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" class="input-med-sub" placeholder="Especialidad" onchange="guardarTitulo('${id}', this.value, 'materia')">
                    </div>
                    <p class="text-[10px] font-medium text-slate-400 mt-4 uppercase tracking-widest">Registrado: ${data.fecha}</p>
                </div>
                
                <div class="flex gap-2 mt-4">
                    <button onclick="abrirSimulador('${id}')" class="flex-1 bg-med-blue hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-lg tracking-widest uppercase transition-all duration-300 shadow-md">
                        Simulador
                    </button>
                    <button onclick="abrirExamen('${id}')" class="flex-1 bg-med-card hover:bg-slate-50 border border-med-border text-med-blue text-xs font-bold py-2.5 rounded-lg tracking-widest uppercase transition-all duration-300 shadow-sm">
                        Banco
                    </button>
                </div>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;
        await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) { console.error(e); }
}

// --- ELIMINAR EXPEDIENTE ---
async function eliminarExpediente(id) {
    if (!confirm("¿Estás seguro de eliminar este expediente por completo?")) return;
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${id}`, { method: 'DELETE' });
        if (res.ok) cargarExamenes();
        else alert("Error al eliminar");
    } catch(e) { alert("Error de conexión"); }
}

// --- MODO BANCO DE PREGUNTAS ---
async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    document.getElementById('dashboard-stats').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    
    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-10 animate-fade-up">
            <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-med-blue text-[10px] font-bold uppercase tracking-widest px-6 py-3 rounded-lg border border-med-border transition-all flex items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver al Archivo
            </button>
        </div>
        
        <div class="mb-12 border-l-4 border-med-jade pl-6 animate-fade-up bg-white p-6 rounded-r-xl shadow-sm">
            <h2 class="text-3xl md:text-4xl font-serif text-med-blue font-bold">${preguntas[0].nombre_personalizado || 'Banco de Preguntas'}</h2>
            <p class="text-med-jade mt-2 text-xs font-bold tracking-widest uppercase">${preguntas.length} preguntas documentadas</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="med-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6 flex gap-4">
                        <span class="text-med-blue font-serif italic text-2xl mt-1 font-bold">${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-med-text font-semibold leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start justify-between gap-4 ${j === p.correcta ? 'border-med-jade bg-emerald-50 dark:bg-emerald-900/20' : ''}" id="alt-${p.id}-${j}">
                                <div class="flex items-start gap-4">
                                    <span class="font-serif text-med-blue font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                    <span>${alt}</span>
                                </div>
                                <button onclick="marcarCorrecta('${p.id}', ${j}, ${i})" class="text-[10px] uppercase font-bold text-slate-400 hover:text-med-jade transition-colors opacity-0 group-hover:opacity-100" title="Marcar como correcta">
                                    ${j === p.correcta ? '✓ Correcta' : 'Marcar'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- EDITAR RESPUESTA CORRECTA ---
async function marcarCorrecta(preguntaId, idxAlternativa, indexVisual) {
    if(!confirm("¿Estás seguro de cambiar la respuesta correcta a esta opción?")) return;
    
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/pregunta/${preguntaId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correcta: idxAlternativa })
        });
        
        if (res.ok) {
            // Actualizar visualmente
            const contenedor = document.getElementById(`p${indexVisual}`);
            const alts = contenedor.querySelectorAll('.alternativa');
            alts.forEach((alt, i) => {
                const btn = alt.querySelector('button');
                if (i === idxAlternativa) {
                    alt.classList.add('border-med-jade', 'bg-emerald-50');
                    btn.innerHTML = '✓ Correcta';
                } else {
                    alt.classList.remove('border-med-jade', 'bg-emerald-50');
                    btn.innerHTML = 'Marcar';
                }
            });
        } else {
            alert("Error al guardar");
        }
    } catch(e) { alert("Error de conexión"); }
}

// --- MODO SIMULADOR (EXAMEN) ---
async function abrirSimulador(grupoId) {
    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    preguntasSimulador = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);
    
    if (!preguntasSimulador.length) return alert("No hay preguntas.");
    
    indexSimulador = 0;
    puntajeSimulador = 0;
    document.getElementById('sim-titulo').innerText = preguntasSimulador[0].nombre_personalizado || 'Examen';
    document.getElementById('modo-simulador').classList.add('activo');
    document.body.style.overflow = 'hidden';
    cargarPreguntaSimulador();
}

function cerrarSimulador() {
    document.getElementById('modo-simulador').classList.remove('activo');
    document.body.style.overflow = 'auto';
    cargarExamenes(); // Recargar por si acaso
}

function cargarPreguntaSimulador() {
    respondidaSimulador = false;
    const p = preguntasSimulador[indexSimulador];
    
    document.getElementById('sim-progreso').innerText = `${indexSimulador + 1} / ${preguntasSimulador.length}`;
    document.getElementById('sim-pregunta').innerText = p.texto_pregunta;
    
    const altsCont = document.getElementById('sim-alternativas');
    altsCont.innerHTML = p.alternativas.map((alt, j) => `
        <div class="alternativa w-full" onclick="responderSimulador(this, ${j}, ${p.correcta})">
            <span class="font-serif text-med-blue font-bold mr-3">${String.fromCharCode(65+j)}.</span> ${alt}
        </div>
    `).join('');
    
    document.getElementById('sim-panel-respuesta').classList.remove('abierto');
    document.getElementById('btn-siguiente').classList.add('hidden');
}

function responderSimulador(el, elegida, correcta) {
    if (respondidaSimulador) return;
    respondidaSimulador = true;
    
    const alts = document.getElementById('sim-alternativas').querySelectorAll('.alternativa');
    alts.forEach((alt, i) => {
        alt.classList.add('bloqueada');
        if (i === correcta) alt.classList.add('correcta');
        else if (i === elegida) alt.classList.add('incorrecta');
    });
    
    if (elegida === correcta) puntajeSimulador++;
    
    const p = preguntasSimulador[indexSimulador];
    document.getElementById('sim-texto-correcta').innerText = p.alternativas[correcta];
    document.getElementById('sim-panel-respuesta').classList.add('abierto');
    document.getElementById('btn-siguiente').classList.remove('hidden');
}

function siguientePregunta() {
    indexSimulador++;
    if (indexSimulador < preguntasSimulador.length) {
        cargarPreguntaSimulador();
    } else {
        mostrarResultadoFinal();
    }
}

function mostrarResultadoFinal() {
    const total = preguntasSimulador.length;
    const porcentaje = Math.round((puntajeSimulador / total) * 100);
    
    document.querySelector('#modo-simulador .max-w-3xl').innerHTML = `
        <div class="flex-1 flex flex-col justify-center items-center text-center animate-fade-up">
            <div class="w-32 h-32 rounded-full border-4 border-med-jade flex items-center justify-center mb-8 bg-emerald-50">
                <span class="text-5xl font-bold text-med-jade">${porcentaje}%</span>
            </div>
            <h2 class="text-3xl font-serif text-med-blue font-bold mb-4">Examen Completado</h2>
            <p class="text-slate-500 mb-8">Has acertado ${puntajeSimulador} de ${total} preguntas.</p>
            
            <div class="flex gap-4">
                <button onclick="cerrarSimulador()" class="bg-med-blue text-white px-8 py-3 rounded-xl hover:bg-slate-800 transition-colors">Volver al Archivo</button>
            </div>
        </div>
    `;
}
</script>
</body>
