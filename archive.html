<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Archive</title>
    
    <!-- Favicon SVG: Caduceo (Base64) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%232b6cb0'%3E%3Cpath d='M50 10c-2.5 0-4.5 2-4.5 4.5S47.5 19 50 19s4.5-2 4.5-4.5S52.5 10 50 10zm0 12v68M30 22c0-4 8-6 20-6s20 2 20 6M30 78c0 4 8 6 20 6s20-2 20-6M20 35c5-10 20-15 30-15s25 5 30 15M20 65c5 10 20 15 30 15s25-5 30-15M38 30c-5 5-5 15 0 20s12 2 12-5-7-10-12-5m24 40c5-5 5-15 0-20s-12-2-12 5 7 10 12 5'/%3E%3Ccircle cx='50' cy='50' r='5'/%3E%3C/g%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'med-bg': '#edf2f7',       // Fondo gris azulado claro
                        'med-dark': '#1a202c',     // Gris muy oscuro para textos
                        'med-blue': '#2b6cb0',     // Azul quirúrgico
                        'med-jade': '#38a169',     // Verde jade (medicina/vida)
                        'med-border': '#cbd5e0',   // Bordes suaves
                        'med-card': '#ffffff',     // Blanco para tarjetas
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #edf2f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(43, 108, 176, 0.05) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(56, 161, 105, 0.05) 0, transparent 50%);
            color: #1a202c;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Animación de latido médico y flotación */
        @keyframes med-pulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }
        .animate-med {
            animation: med-pulse 4s ease-in-out infinite;
        }

        /* Animación de entrada escalonada */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Tarjetas clínicas */
        .med-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .med-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(-4px);
            border-color: #2b6cb0;
        }

        /* Alternativas */
        .alternativa {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }

        .alternativa:hover:not(.bloqueada) {
            background: #ebf8ff;
            border-color: #2b6cb0;
            color: #2b6cb0;
            padding-left: 30px;
        }

        .alternativa.correcta {
            background: #f0fff4;
            border-color: #38a169;
            color: #276749;
            font-weight: 600;
        }

        .alternativa.incorrecta {
            background: #fff5f5;
            border-color: #e53e3e;
            color: #c53030;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Inputs */
        .input-med {
            background: transparent;
            border-bottom: 2px dashed transparent;
            color: #1a202c;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-med:hover, .input-med:focus {
            border-bottom: 2px dashed #2b6cb0;
        }

        .input-med-sub {
            background: transparent;
            border-bottom: 1px solid transparent;
            color: #2b6cb0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-med-sub:hover, .input-med-sub:focus {
            border-bottom: 1px solid #38a169;
            color: #38a169;
        }

        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }
    </style>
</head>
<body class="p-6 md:p-12">

<div class="max-w-6xl mx-auto space-y-10">
    
    <!-- HEADER CON CADUCEO DETALLADO -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 pb-8 border-b-2 border-med-border animate-fade-up">
        <div class="flex items-center gap-6">
            <!-- Símbolo del Caduceo -->
            <div class="w-20 h-20 rounded-2xl bg-med-blue flex items-center justify-center shadow-lg animate-med relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-tr from-med-blue to-med-jade opacity-80"></div>
                <svg class="w-12 h-12 text-white relative z-10" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Alas -->
                    <path d="M50 25 C30 25 20 35 20 35 C35 35 45 30 50 25 Z" fill="currentColor" opacity="0.8"/>
                    <path d="M50 25 C70 25 80 35 80 35 C65 35 55 30 50 25 Z" fill="currentColor" opacity="0.8"/>
                    <!-- Bastón central -->
                    <line x1="50" y1="15" x2="50" y2="85" stroke-width="6"/>
                    <!-- Serpientes -->
                    <path d="M40 35 C35 40 35 50 45 55 C55 60 65 55 60 45 C55 35 45 40 45 50 C45 60 55 65 60 75 C65 85 45 85 40 75" />
                    <!-- Círculo superior -->
                    <circle cx="50" cy="10" r="5" fill="currentColor" stroke="none"/>
                </svg>
            </div>
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-med-jade tracking-[0.2em] text-[10px] font-bold uppercase">Departamento Médico</span>
                    <span class="h-px w-8 bg-med-jade"></span>
                </div>
                <h1 class="text-4xl md:text-5xl font-serif text-med-dark tracking-tight font-bold">Atlas Clínico</h1>
                <p class="text-slate-500 text-sm mt-1 font-medium">Repositorio Oficial de Exámenes.</p>
            </div>
        </div>
        <a href="index.html" class="bg-white hover:bg-slate-50 text-med-dark text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-lg border border-med-border transition-all flex items-center gap-2 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- DASHBOARD -->
    <div id="dashboard-stats" class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-up" style="animation-delay: 0.1s">
        <!-- Se llena con JS -->
    </div>

    <!-- GRID DE EXÁMENES -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 text-med-blue font-serif italic text-lg animate-pulse">
            Cargando expedientes...
        </div>
    </div>

    <!-- VISTA DE PREGUNTAS -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-lg bg-white border border-med-border rounded-xl">El archivo está vacío. Realiza un examen para comenzar.</div>';
            document.getElementById('dashboard-stats').innerHTML = '';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        // Dashboard
        document.getElementById('dashboard-stats').innerHTML = `
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-med-blue">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Total Preguntas</span>
                <span class="text-3xl font-serif text-med-dark font-bold">${preguntas.length}</span>
            </div>
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-med-jade">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Expedientes</span>
                <span class="text-3xl font-serif text-med-dark font-bold">${Object.keys(grupos).length}</span>
            </div>
            <div class="med-card p-6 flex flex-col justify-center border-l-4 border-l-slate-400">
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-1">Estado del Sistema</span>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-med-jade animate-pulse"></span>
                    <span class="text-sm font-bold text-med-jade tracking-wide uppercase">En Línea</span>
                </div>
            </div>
        `;

        // Grid
        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="med-card p-6 flex flex-col justify-between h-60 group animate-fade-up" style="animation-delay: ${(index * 0.1) + 0.3}s">
                
                <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-med-blue">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="text-[10px] font-bold tracking-widest text-med-dark bg-slate-50 border border-slate-200 px-3 py-1 rounded-sm">${data.total} PREGUNTAS</span>
                </div>

                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-med" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-med-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                    </div>
                    <p class="text-[10px] font-medium text-slate-400 mt-4 uppercase tracking-widest">Registrado: ${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full mt-4 bg-med-dark hover:bg-med-blue text-white text-xs font-bold py-3 rounded-lg tracking-widest uppercase transition-all duration-300">
                    Revisar Expediente
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Error');
    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    document.getElementById('dashboard-stats').classList.add('hidden');
    
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-med-blue font-serif italic text-lg animate-pulse">Abriendo expediente...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-10 animate-fade-up">
            <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-med-dark text-[10px] font-bold uppercase tracking-widest px-6 py-3 rounded-lg border border-med-border transition-all flex items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver al Archivo
            </button>
        </div>
        
        <div class="mb-12 border-l-4 border-med-jade pl-6 animate-fade-up bg-white p-6 rounded-r-xl shadow-sm">
            <h2 class="text-3xl md:text-4xl font-serif text-med-dark font-bold">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-slate-500 mt-2 text-xs font-bold tracking-widest uppercase">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} preguntas</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="bg-white border border-med-border rounded-xl p-8 md:p-10 animate-fade-up shadow-sm" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6 flex gap-4">
                        <span class="text-med-blue font-serif italic text-2xl mt-1 font-bold">${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-med-dark font-semibold leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-med-blue font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end pl-0 md:pl-12">
                        <button onclick="verCorrecta('p${i}')" class="text-[10px] font-bold tracking-widest text-med-blue hover:text-white uppercase transition-colors flex items-center gap-2 bg-transparent hover:bg-med-blue px-4 py-2 rounded-lg border border-med-blue">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar Respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-12" id="panel-p${i}">
                        <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-xl flex items-start gap-4">
                            <svg class="w-5 h-5 text-emerald-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-emerald-800 font-bold text-[10px] tracking-widest uppercase mb-1">Respuesta Correcta</h4>
                                <p class="text-emerald-950 font-serif text-lg font-semibold">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
