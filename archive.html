<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0a0f1c',
                        'brand-gold': '#d4af37',
                        'brand-cyan': '#06b6d4',
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0f1c;
            background-image: radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05), transparent 25%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.1);
            transform: translateY(-4px);
        }

        .alternativa {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: #cbd5e1;
        }

        .alternativa:hover:not(.bloqueada) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(6, 182, 212, 0.5);
            color: #ffffff;
        }

        .alternativa.correcta {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #34d399;
            font-weight: 500;
        }

        .alternativa.incorrecta {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #f87171;
        }

        .alternativa.bloqueada { cursor: default; }

        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease, margin 0.5s ease;
            opacity: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 20px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Estilos para los inputs de edición */
        .editable-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        .editable-input:focus {
            border-color: #06b6d4;
        }
    </style>
</head>
<body class="p-6 md:p-12">

<div class="max-w-6xl mx-auto space-y-12">
    
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-white/10 pb-8 animate-fade-up">
        <div>
            <div class="flex items-center gap-3 mb-2">
                <div class="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></div>
                <p class="text-brand-gold tracking-[0.2em] text-xs font-bold uppercase">Atlas Médico Premium</p>
            </div>
            <h1 class="text-4xl md:text-5xl font-serif text-white">Archivo de Exámenes</h1>
        </div>
        <a href="index.html" class="bg-white/5 hover:bg-white/10 text-white text-sm font-medium px-6 py-3 rounded-lg border border-white/10 transition-all flex items-center gap-2 backdrop-blur-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 text-brand-cyan/50 font-serif italic text-xl animate-pulse">
            Cargando exámenes...
        </div>
    </div>

    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500 font-serif italic text-xl">No hay exámenes guardados todavía. Vacía la tabla o haz un nuevo examen.</div>';
            return;
        }

        // Agrupar por grupo_id
        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="glass-card p-8 flex flex-col justify-between h-52 group animate-fade-up relative" style="animation-delay: ${index * 0.1}s">
                
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-lg bg-brand-cyan/10 flex items-center justify-center border border-brand-cyan/20">
                        <svg class="w-5 h-5 text-brand-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="bg-white/5 text-slate-300 text-xs font-medium px-3 py-1 rounded-full border border-white/10">${data.total} preguntas</span>
                </div>

                <div class="flex-1 mb-4">
                    <!-- Campos Editables -->
                    <div class="flex items-center gap-2 mb-2 group/edit">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="bg-transparent border-b border-transparent hover:border-white/30 focus:border-brand-cyan text-xl font-serif text-white outline-none w-full transition-colors"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                        <svg class="w-4 h-4 text-slate-500 opacity-0 group-hover/edit:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2 group/edit">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="bg-transparent border-b border-transparent hover:border-white/30 focus:border-brand-cyan text-sm text-brand-gold outline-none w-full transition-colors"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                        <svg class="w-3 h-3 text-slate-500 opacity-0 group-hover/edit:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full bg-white/5 hover:bg-white/10 text-white text-sm font-medium py-2 rounded-lg border border-white/10 transition-colors">
                    Abrir Examen
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos.</div>'; 
    }
}

// Función para guardar el título o la materia editada
async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        // Actualizamos todas las preguntas de ese grupo con el nuevo texto
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Error al guardar');
        
        // Efecto visual de guardado exitoso
        const input = document.getElementById(`${tipo}-${grupoId}`);
        input.classList.add('border-green-500');
        setTimeout(() => input.classList.remove('border-green-500'), 1000);

    } catch (e) {
        alert("Error al guardar. Revisa la consola.");
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-brand-cyan/50 font-serif italic text-xl">Abriendo examen...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="bg-white/5 hover:bg-white/10 text-slate-300 text-sm font-medium px-5 py-2.5 rounded-lg border border-white/10 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a los exámenes
            </button>
        </div>
        
        <div class="mb-10 animate-fade-up">
            <h2 class="text-3xl md:text-4xl font-serif text-white">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-brand-gold mt-2 text-sm font-medium tracking-wide uppercase">${preguntas.length} preguntas en esta sesión.</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="glass-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6 flex gap-4">
                        <span class="text-brand-cyan font-serif italic text-2xl mt-1">Q${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-slate-200 font-medium leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-brand-cyan/70 font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-white/10 flex justify-end pl-0 md:pl-12">
                        <button onclick="verCorrecta('p${i}')" class="text-xs font-bold tracking-widest text-brand-gold hover:text-white uppercase transition-colors flex items-center gap-2 bg-brand-gold/10 hover:bg-brand-gold/20 px-4 py-2 rounded border border-brand-gold/20">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-12" id="panel-p${i}">
                        <div class="bg-brand-gold/5 border border-brand-gold/30 p-6 rounded-xl flex items-start gap-4">
                            <svg class="w-6 h-6 text-brand-gold mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-brand-gold font-bold text-sm tracking-wider uppercase mb-1">Respuesta Correcta</h4>
                                <p class="text-white font-serif text-lg">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
