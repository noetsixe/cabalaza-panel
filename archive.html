<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Archive</title>
    
    <!-- Fuentes de Lujo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'med-navy': '#0A1128',
                        'med-dark': '#0F172A',
                        'med-gold': '#C5A059',
                        'med-gold-light': '#E6C687',
                        'med-cyan': '#00B4D8',
                        'med-slate': '#1E293B',
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Cormorant Garamond', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: #070C1E;
            background-image: 
                radial-gradient(at 10% 10%, rgba(12, 35, 64, 0.8) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(197, 160, 89, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(0, 180, 216, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
            color: #F1F5F9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Tarjetas con efecto Glassmorphism Luxury */
        .glass-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75) 0%, rgba(10, 17, 40, 0.65) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.6s var(--ease-out-expo), border-color 0.6s var(--ease-out-expo), box-shadow 0.6s var(--ease-out-expo);
        }

        .glass-card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(197, 160, 89, 0.15);
            transform: translateY(-4px);
            border-color: rgba(197, 160, 89, 0.3);
        }

        /* Alternativas refinadas */
        .alternativa {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.4s var(--ease-out-expo);
            font-size: 15px;
            color: #CBD5E1;
            font-weight: 400;
        }

        .alternativa:hover:not(.bloqueada) {
            background: rgba(197, 160, 89, 0.08);
            border-color: rgba(197, 160, 89, 0.4);
            color: #FFFFFF;
            transform: translateX(6px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .alternativa.correcta {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34D399;
            font-weight: 500;
        }

        .alternativa.incorrecta {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.5);
            color: #FCA5A5;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Panel de respuesta */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.6s var(--ease-out-expo);
            opacity: 0;
            margin-top: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }

        /* Inputs de edición refinados */
        .input-clinico {
            background: transparent;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            color: #F8FAFC;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .input-clinico:focus, .input-clinico:hover {
            border-bottom-color: #C5A059;
        }

        .input-sub {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            color: #94A3B8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            outline: none;
            width: 100%;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .input-sub:focus, .input-sub:hover {
            border-bottom-color: rgba(197, 160, 89, 0.6);
            color: #CBD5E1;
        }

        /* Animaciones suaves */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s var(--ease-out-expo) forwards;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-16">

<div class="max-w-6xl mx-auto space-y-12">
    
    <!-- Header Exclusivo -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-10 border-b border-white/10 animate-fade-up">
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-med-gold/20 via-med-navy to-med-dark border border-med-gold/30 flex items-center justify-center shadow-2xl animate-float">
                <svg class="w-8 h-8 text-med-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div>
                <p class="text-med-gold tracking-[0.3em] text-xs font-semibold uppercase mb-1">Base de Conocimiento Médico</p>
                <h1 class="text-4xl md:text-5xl font-serif text-white tracking-wide font-light">Atlas Clínico</h1>
            </div>
        </div>
        <a href="index.html" class="bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-medium tracking-widest uppercase px-6 py-3.5 rounded-xl border border-white/10 hover:border-med-gold/40 transition-all flex items-center gap-3 backdrop-blur-md">
            <svg class="w-4 h-4 text-med-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- Grid de Exámenes -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-24 text-med-gold font-serif italic text-2xl tracking-wide animate-pulse">
            Sincronizando expedientes clínicos...
        </div>
    </div>

    <!-- Vista de Preguntas -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500 font-serif italic text-xl">No se encontraron expedientes en el archivo histórico.</div>';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="glass-card p-8 flex flex-col justify-between h-72 group animate-fade-up relative" style="animation-delay: ${index * 0.08}s">
                
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 rounded-xl bg-med-gold/10 border border-med-gold/20 flex items-center justify-center text-med-gold group-hover:scale-105 transition-transform">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="bg-white/5 border border-white/10 text-med-gold text-xs font-semibold px-3.5 py-1.5 rounded-full shadow-inner">${data.total} reactivos</span>
                </div>

                <div class="flex-1 mb-4 space-y-2">
                    <div class="flex items-center gap-2">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-clinico" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                        <svg class="w-4 h-4 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                        <svg class="w-3 h-3 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <p class="text-[10px] font-semibold text-slate-500 pt-1 uppercase tracking-widest">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full bg-gradient-to-r from-med-gold to-med-gold-light hover:from-med-gold-light hover:to-med-gold text-med-navy text-xs font-bold uppercase tracking-wider py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95">
                    Abrir Expediente
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-rose-400 py-12 font-serif">Error al intentar recuperar la información del servidor.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Error al guardar');
        
        const input = document.getElementById(`${tipo}-${grupoId}`);
        input.classList.add('text-emerald-400');
        setTimeout(() => input.classList.remove('text-emerald-400'), 1200);

    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-24 text-med-gold font-serif italic text-2xl tracking-wide animate-pulse">Cargando expediente clínico...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="bg-white/5 hover:bg-white/10 text-slate-300 text-xs font-medium tracking-widest uppercase px-5 py-3 rounded-xl border border-white/10 transition-all flex items-center gap-2.5 backdrop-blur-md">
                <svg class="w-4 h-4 text-med-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a la selección
            </button>
        </div>
        
        <div class="mb-12 pl-6 border-l-2 border-med-gold animate-fade-up">
            <h2 class="text-3xl md:text-5xl font-serif text-white font-light">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-med-gold/80 mt-2 text-xs font-semibold tracking-widest uppercase">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} Reactivos Clínicos</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="glass-card p-8 md:p-12 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-8 flex gap-5 items-start">
                        <span class="text-med-gold font-serif italic text-3xl font-light leading-none">0${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-slate-100 font-normal leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3.5 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-med-gold font-semibold text-lg leading-none mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-white/5 flex justify-end pl-0 md:pl-12">
                        <button onclick="verCorrecta('p${i}')" class="text-[11px] font-semibold tracking-widest text-slate-400 hover:text-med-gold uppercase transition-colors flex items-center gap-2 bg-white/5 hover:bg-white/10 px-4 py-2.5 rounded-lg border border-white/5">
                            <svg class="w-4 h-4 text-med-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-12" id="panel-p${i}">
                        <div class="bg-emerald-950/30 border border-emerald-500/30 p-6 rounded-2xl flex items-start gap-4 shadow-xl backdrop-blur-md">
                            <svg class="w-6 h-6 text-emerald-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-emerald-400 font-semibold text-xs tracking-widest uppercase mb-1">Respuesta Correcta</h4>
                                <p class="text-slate-100 font-serif text-lg font-light">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
