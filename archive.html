<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de Exámenes | The Medical Archive</title>
    
    <!-- Fuentes Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-dark': '#0f172a', // Azul marino profundo
                        'medical-gold': '#c5a059', // Dorado elegante
                        'medical-bg': '#fcfcfb',   // Blanco marfil
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fcfcfb;
            background-image: 
                linear-gradient(to right, rgba(197, 160, 89, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(197, 160, 89, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Tarjetas con sombra de lujo */
        .luxury-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px; /* Bordes más rectos = más elegante */
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #c5a059; /* Detalle dorado lateral */
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s ease;
        }

        .luxury-card:hover {
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.15);
            transform: translateY(-2px);
        }

        .luxury-card:hover::before {
            transform: scaleY(1);
        }

        /* Alternativas */
        .alternativa {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: #334155;
        }

        .alternativa:hover:not(.bloqueada) {
            background: #f8fafc;
            border-color: #c5a059;
            color: #0f172a;
            padding-left: 24px; /* Pequeño efecto de desplazamiento */
        }

        .alternativa.correcta {
            background: #f0fdf4;
            border-color: #16a34a;
            color: #166534;
            font-weight: 500;
        }

        .alternativa.incorrecta {
            background: #fef2f2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Panel de respuesta */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease, margin 0.5s ease;
            opacity: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 20px;
        }

        /* Animación de aparición */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

<div class="max-w-5xl mx-auto space-y-12">
    
    <!-- Header Estilo Editorial -->
    <header class="border-b border-slate-200 pb-8 flex flex-col md:flex-row justify-between items-end gap-6 animate-fade-up">
        <div>
            <p class="text-medical-gold tracking-[0.2em] text-xs font-semibold uppercase mb-2">The Medical Archive</p>
            <h1 class="text-4xl md:text-5xl font-serif text-medical-dark font-bold">Colección de Exámenes</h1>
            <p class="text-slate-500 mt-3 font-light text-lg">Biblioteca clínica de preguntas y respuestas documentadas.</p>
        </div>
        <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-medical-dark transition-colors flex items-center gap-2 pb-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al sistema
        </a>
    </header>

    <!-- Vistas -->
    <div id="vista-materias" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-xl">
            Cargando registros médicos...
        </div>
    </div>

    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarMaterias();
};

async function cargarMaterias() {
    const cont = document.getElementById('vista-materias');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-xl">No hay exámenes en el archivo todavía.</div>';
            return;
        }

        const materias = {};
        preguntas.forEach(p => { materias[p.materia] = (materias[p.materia] || 0) + 1; });

        cont.innerHTML = Object.entries(materias).map(([mat, count], index) => `
            <div onclick="abrirMateria('${mat}')" class="luxury-card p-8 cursor-pointer flex flex-col justify-between group animate-fade-up" style="animation-delay: ${index * 0.1}s">
                <div class="flex justify-between items-start mb-6">
                    <span class="text-xs font-semibold tracking-wider text-medical-gold uppercase border border-medical-gold/30 px-3 py-1 rounded-sm bg-medical-gold/5">Especialidad</span>
                    <span class="text-slate-400 text-sm font-medium">${count} preguntas</span>
                </div>
                <div>
                    <h3 class="text-2xl font-serif text-medical-dark group-hover:text-medical-gold transition-colors duration-300">${mat}</h3>
                    <div class="mt-4 flex items-center text-sm text-slate-400 group-hover:text-slate-600 transition-colors">
                        <span>Ver expediente</span>
                        <svg class="w-4 h-4 ml-2 group-hover:translate-x-2 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                    </div>
                </div>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos.</div>'; 
    }
}

async function abrirMateria(materia) {
    document.getElementById('vista-materias').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-slate-400 font-serif italic text-xl">Abriendo expediente clínico...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => p.materia === materia);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="text-sm text-slate-500 hover:text-medical-dark transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a la colección
            </button>
        </div>
        
        <div class="mb-10 border-l-4 border-medical-gold pl-6 animate-fade-up">
            <h2 class="text-3xl font-serif text-medical-dark">${materia}</h2>
            <p class="text-slate-500 mt-2">${preguntas.length} preguntas documentadas en este expediente.</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="luxury-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6">
                        <span class="text-medical-gold font-serif italic text-lg mr-2">Q${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-medical-dark font-medium leading-relaxed inline">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-slate-400 font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                        <button onclick="verCorrecta('p${i}')" class="text-xs font-semibold tracking-widest text-slate-500 hover:text-medical-gold uppercase transition-colors flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta" id="panel-p${i}">
                        <div class="bg-[#fcfcfb] border border-medical-gold/30 p-6 rounded-sm flex items-start gap-4">
                            <svg class="w-5 h-5 text-medical-gold mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-medical-gold font-semibold text-sm tracking-wider uppercase mb-2">Respuesta Correcta</h4>
                                <p class="text-medical-dark font-serif text-lg">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
