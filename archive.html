<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Japandi Archive</title>
    
    <!-- Tipografías refinadas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jp-bg': '#F8F6F0',         // Lino / Blanco roto natural
                        'jp-card': '#FFFFFF',       // Blanco puro
                        'jp-dark': '#2A2825',       // Carbón suave orgánico
                        'jp-accent': '#8C6D53',     // Madera sutil / Bronce orgánico
                        'jp-sub': '#7C7873',        // Gris piedra
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Shippori Mincho', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --ease-out-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            background-color: #F8F6F0;
            background-image: 
                radial-gradient(at 0% 0%, rgba(235, 230, 220, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(140, 109, 83, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
            color: #2A2825;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Tarjetas estilo Minimalismo Orgánico */
        .glass-card {
            background: #FFFFFF;
            border: 1px solid rgba(42, 40, 37, 0.06);
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(42, 40, 37, 0.04);
            transition: transform 0.5s var(--ease-out-smooth), box-shadow 0.5s var(--ease-out-smooth), border-color 0.5s var(--ease-out-smooth);
        }

        .glass-card:hover {
            box-shadow: 0 20px 40px -15px rgba(42, 40, 37, 0.08);
            transform: translateY(-3px);
            border-color: rgba(140, 109, 83, 0.25);
        }

        /* Alternativas estilo Wabi-Sabi */
        .alternativa {
            background: #FAFAF9;
            border: 1px solid rgba(42, 40, 37, 0.06);
            border-radius: 12px;
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.35s var(--ease-out-smooth);
            font-size: 14.5px;
            color: #4A4743;
            font-weight: 400;
        }

        .alternativa:hover:not(.bloqueada) {
            background: #FFFFFF;
            border-color: #8C6D53;
            color: #2A2825;
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(42, 40, 37, 0.03);
        }

        .alternativa.correcta {
            background: #F0F4F1;
            border-color: #587B62;
            color: #2C4233;
            font-weight: 500;
        }

        .alternativa.incorrecta {
            background: #F9F1F1;
            border-color: #A65D5D;
            color: #613333;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Panel de respuesta fluido */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s var(--ease-out-smooth);
            opacity: 0;
            margin-top: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }

        /* Inputs limpios */
        .input-clinico {
            background: transparent;
            border-bottom: 1px solid rgba(140, 109, 83, 0.3);
            color: #2A2825;
            font-family: 'Shippori Mincho', serif;
            font-size: 1.5rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .input-clinico:focus, .input-clinico:hover {
            border-bottom-color: #8C6D53;
        }

        .input-sub {
            background: transparent;
            border-bottom: 1px solid rgba(42, 40, 37, 0.1);
            color: #7C7873;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            outline: none;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .input-sub:focus, .input-sub:hover {
            border-bottom-color: #8C6D53;
            color: #2A2825;
        }

        /* Animaciones suaves */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeIn 0.7s var(--ease-out-smooth) forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-16">

<div class="max-w-6xl mx-auto space-y-12">
    
    <!-- Header Minimalista Japandi -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-8 border-b border-stone-300/60 animate-fade-up">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 rounded-2xl bg-stone-900 text-stone-100 flex items-center justify-center shadow-md">
                <svg class="w-6 h-6 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div>
                <p class="text-stone-500 tracking-[0.25em] text-[10px] font-bold uppercase mb-0.5">Archivo Clínico Armónico</p>
                <h1 class="text-3xl md:text-4xl font-serif text-stone-900 font-medium">臨床アトラス • Atlas</h1>
            </div>
        </div>
        <a href="index.html" class="bg-stone-200/60 hover:bg-stone-200 text-stone-800 text-xs font-semibold tracking-wider uppercase px-5 py-3 rounded-xl transition-all flex items-center gap-2">
            <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- Grid de Exámenes -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 text-stone-400 font-serif italic text-xl animate-pulse">
            Leyendo registros clínicos...
        </div>
    </div>

    <!-- Vista de Preguntas -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-stone-400 font-serif italic text-xl">No hay expedientes almacenados.</div>';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="glass-card p-7 flex flex-col justify-between h-64 group animate-fade-up relative" style="animation-delay: ${index * 0.06}s">
                
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-xl bg-stone-100 flex items-center justify-center text-stone-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="bg-stone-100 text-stone-700 text-xs font-semibold px-3 py-1 rounded-full">${data.total} reactivos</span>
                </div>

                <div class="flex-1 mb-4 space-y-1">
                    <div class="flex items-center gap-2">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-clinico" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                        <svg class="w-3.5 h-3.5 text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                        <svg class="w-3 h-3 text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <p class="text-[10px] font-medium text-stone-400 pt-2 uppercase tracking-widest">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full bg-stone-900 hover:bg-stone-800 text-stone-100 text-xs font-bold uppercase tracking-wider py-3 rounded-xl transition-all shadow-sm">
                    Abrir Expediente
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-rose-600 py-10 font-serif">Error de conexión con el servidor.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Error al guardar');
        
        const input = document.getElementById(`${tipo}-${grupoId}`);
        input.classList.add('text-emerald-700');
        setTimeout(() => input.classList.remove('text-emerald-700'), 1200);

    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-stone-500 font-serif italic text-xl animate-pulse">Abriendo expediente...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="bg-stone-200/60 hover:bg-stone-200 text-stone-800 text-xs font-semibold tracking-wider uppercase px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
                <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a la selección
            </button>
        </div>
        
        <div class="mb-10 pl-6 border-l-2 border-stone-800 animate-fade-up">
            <h2 class="text-3xl md:text-4xl font-serif text-stone-900 font-medium">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-stone-500 mt-2 text-xs font-semibold tracking-widest uppercase">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} Preguntas</p>
        </div>
        
        <div class="space-y-6">
            ${preguntas.map((p, i) => `
                <div class="glass-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.04}s">
                    <div class="mb-6 flex gap-4 items-start">
                        <span class="text-stone-400 font-serif italic text-xl font-light">0${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-stone-900 font-medium leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-6 pl-0 md:pl-10">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-3.5" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-stone-500 font-semibold text-sm mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-stone-100 flex justify-end pl-0 md:pl-10">
                        <button onclick="verCorrecta('p${i}')" class="text-[11px] font-bold tracking-widest text-stone-600 hover:text-stone-900 uppercase transition-colors flex items-center gap-2 bg-stone-100 hover:bg-stone-200/70 px-4 py-2 rounded-lg">
                            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-10" id="panel-p${i}">
                        <div class="bg-[#F0F4F1] border border-[#587B62]/30 p-5 rounded-xl flex items-start gap-3 shadow-sm">
                            <svg class="w-5 h-5 text-[#2C4233] mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-[#2C4233] font-bold text-xs tracking-wider uppercase mb-0.5">Respuesta Correcta</h4>
                                <p class="text-[#2C4233] font-serif text-base">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
