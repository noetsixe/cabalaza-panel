                extend: {
                    colors: {
                        med: {
                            bg: 'var(--med-bg)',
                            blue: 'var(--med-blue)',
                            jade: 'var(--med-jade)',

                            subtext: 'var(--med-subtext)',
                            border: 'var(--med-border)',

    <style>
        /* VARIABLES DE TEMA (MODO CLARO POR DEFECTO) */
        :root {
            --med-bg: #f8fafc;
            --med-blue: #0b132b;
            --med-jade: #0d9488;
            --med-text: #0f172a;
            --med-subtext: #64748b;
            --med-border: #e2e8f0;
            --med-card: #ffffff;
            --med-card-hover: #ffffff;
            --med-accent: #f1f5f9;
            --shadow-subtle: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 20px 35px -10px rgba(13, 148, 136, 0.12);
        }

        /* MODO OSCURO "RICO" (DARK MODE PROFUNDO & ELEGANTE) */
        body.dark-mode {
            --med-bg: #090d16;        /* Azul noche ultra profundo */
            --med-blue: #60a5fa;      /* Azul brillante y legible */
            --med-jade: #2dd4bf;      /* Turquesa vívido */
            --med-text: #f1f5f9;      /* Lectura nitida slate-100 */
            --med-subtext: #94a3b8;   /* Texto secundario legibilidad excelente */
            --med-border: #1e293b;    /* Bordes bien contrastados */
            --med-card: #131b2e;      /* Tarjeta elevación azul marino */
            --med-card-hover: #19243d;/* Hover sutil de tarjeta */
            --med-accent: #1e293b;
            --shadow-subtle: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 40px -10px rgba(45, 212, 191, 0.15);
        }

        /* BASES & TRANSICIONES DE MODO */
        body {
            background-color: var(--med-bg);
            color: var(--med-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background-image: radial-gradient(circle at 50% 0%, var(--med-card) 0%, var(--med-bg) 75%);
            background-attachment: fixed;
        }

        /* ANIMACIONES FLUIDAS */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        @keyframes floatMed {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .animate-float {
            animation: floatMed 6s ease-in-out infinite;
        }
        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* ESTILOS DE TARJETAS Y CONTENEDORES CON ADAPTABILIDAD TOTAL MODO OSCURO */
        .med-card {
            background-color: var(--med-card);
            border: 1px solid var(--med-border);
            border-radius: 16px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-subtle);
        }
        .med-card:hover {
            transform: translateY(-6px) scale(1.01);
            background-color: var(--med-card-hover);
            border-color: var(--med-jade);
            box-shadow: var(--shadow-hover);
        }

        /* INPUTS EDITABLES ULTRA ELEGANTES */
        .input-med {
            background: transparent;
            border-bottom: 2px dashed transparent;
            color: var(--med-text);
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        .input-med:hover, .input-med:focus {
            border-bottom-color: var(--med-jade);
            background: rgba(13, 148, 136, 0.04);
            padding-left: 4px;
        }
        .input-med-sub {
            background: transparent;
            border-bottom: 1px solid transparent;
            color: var(--med-jade);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        .input-med-sub:hover, .input-med-sub:focus {
            border-bottom-color: var(--med-blue);
        }

        /* OPCIONES DE ALTERNATIVAS PARA EL SIMULADOR */
        .alternativa {
            background: var(--med-card);
            border: 1.5px solid var(--med-border);
            border-radius: 12px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.95rem;
            color: var(--med-text);
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        .alternativa:hover:not(.bloqueada) {
            background: var(--med-accent);
            border-color: var(--med-jade);
            transform: translateX(4px);
        }
        .alternativa.correcta {
            background: rgba(13, 148, 136, 0.12) !important;
            border-color: var(--med-jade) !important;
            color: var(--med-jade) !important;
            font-weight: 700;
        }
        .alternativa.incorrecta {
            background: rgba(239, 68, 68, 0.12) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }
        .alternativa.bloqueada {
            cursor: default;
        }

        /* PANEL EXPANDIBLE */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(10px);
        }
        .panel-correcta.abierto {
            max-height: 250px;
            opacity: 1;
            transform: translateY(0);
            margin-top: 16px;
        }

        /* MODAL SIMULADOR */
        #modo-simulador {
            position: fixed;
            inset: 0;
            background: var(--med-bg);
            z-index: 99999;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        #modo-simulador.activo {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        /* SCROLLBAR PERSONALIZADA */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--med-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--med-border);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--med-jade);
        }
    </style>
</head>

// --- CARGA DE EXPEDIENTES / EXÁMENES ---

// --- ACTUALIZAR TITULO Y MATERIA ---
async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        // Actualización local
        examenesGlobales.forEach(p => {
            if ((p.grupo_id || 'antiguo') === grupoId) {
                if (tipo === 'nombre') p.nombre_personalizado = nuevoTexto;
                if (tipo === 'materia') p.materia_personalizada = nuevoTexto;
            }
        });
        localStorage.setItem('atlas_examenes_local', JSON.stringify(examenesGlobales));

        const endpoint = USE_SUPABASE_REST 
            ? `${URL_SERVIDOR}/rest/v1/examenes?grupo_id=eq.${grupoId}` 
            : `${URL_SERVIDOR}/api/admin/examenes/${grupoId}`;

        console.log("--> Enviando petición a:", endpoint); // 👈 VER EN CONSOLA

        const res = await fetch(endpoint, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) {
            const errorTexto = await res.text();
            console.error("--> ERROR DEL SERVIDOR:", errorTexto); // 👈 VER EN CONSOLA
            alert("El servidor rechazó el cambio: " + errorTexto);
        } else {
            console.log("--> Guardado exitoso");
        }

    } catch (e) { 
        console.error("Error de red al guardar título:", e); 
        alert("No se pudo conectar con el servidor.");
    }
}

// --- ELIMINAR EXPEDIENTE COMPLETO ---
async function eliminarExpediente(id) {
    if (!confirm("¿Deseas eliminar permanentemente este expediente y todas sus preguntas asociadas?")) return;
    try {
        examenesGlobales = examenesGlobales.filter(p => (p.grupo_id || 'antiguo') !== id);
        localStorage.setItem('atlas_examenes_local', JSON.stringify(examenesGlobales));

        const endpoint = USE_SUPABASE_REST 
            ? `${URL_SERVIDOR}/rest/v1/examenes?grupo_id=eq.${id}` 
            : `${URL_SERVIDOR}/api/admin/examenes/${id}`;

        await fetch(endpoint, { method: 'DELETE' }).catch(() => {});
        cargarExamenes();
    } catch(e) { 
        cargarExamenes();
    }
}

                                        ${j === p.correcta ? '✓' : String.fromCharCode(65+j)}

// CAMBIO VISUAL AL MARCAR RADIO BUTTON DE OPCION CORRECTA

    const card = document.getElementById(`grid-alts-${preguntaId}`);
    const wrappers = card.querySelectorAll('[id^="wrapper-alt-"]');
    
    wrappers.forEach((w, j) => {
        const btn = w.querySelector('button');
        if (j === idxCorrecta) {
            w.className = 'flex items-center gap-2 p-2 rounded-xl border transition-all bg-emerald-500/10 border-emerald-500/40 text-emerald-500 font-semibold';
            btn.className = 'w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border transition-all bg-emerald-500 border-emerald-500 text-white';
            btn.innerText = '✓';
            w.dataset.correcta = "true";
        } else {
            w.className = 'flex items-center gap-2 p-2 rounded-xl border transition-all bg-med-accent border-med-border text-med-text';
            btn.className = 'w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border border-med-border text-med-subtext hover:border-med-jade';
            btn.innerText = String.fromCharCode(65 + j);
            delete w.dataset.correcta;
        }
    });
}

// GUARDAR PREGUNTA COMPLETA (TEXTO + ALTERNATIVAS + CORRECTA) A SUPABASE / REST API
async function guardarCambiosPregunta(preguntaId, numAlternativas) {
    const btn = document.getElementById(`btn-save-${preguntaId}`);
    const textoPregunta = document.getElementById(`input-pregunta-${preguntaId}`).value.trim();
    
    // Recolectar alternativas
    const alternativas = [];
    let correctaIdx = 0;

    for (let j = 0; j < numAlternativas; j++) {
        const inputAlt = document.getElementById(`alt-input-${preguntaId}-${j}`);
        alternativas.push(inputAlt.value.trim());
        
        const wrapper = document.getElementById(`wrapper-alt-${preguntaId}-${j}`);
        if (wrapper.dataset.correcta === "true" || wrapper.classList.contains('bg-emerald-500/10')) {
            correctaIdx = j;
        }
    }

    if (!textoPregunta) return alert("El texto de la pregunta no puede estar vacío.");

    try {
        btn.disabled = true;
        btn.innerText = "Guardando...";

        const payload = {
            texto_pregunta: textoPregunta,
            alternativas: alternativas,
            correcta: correctaIdx
        };

        // Guardado local
        const idx = examenesGlobales.findIndex(p => p.id === preguntaId);
        if (idx !== -1) {
            examenesGlobales[idx].texto_pregunta = textoPregunta;
            examenesGlobales[idx].alternativas = alternativas;
            examenesGlobales[idx].correcta = correctaIdx;
            localStorage.setItem('atlas_examenes_local', JSON.stringify(examenesGlobales));
        }

        const endpoint = USE_SUPABASE_REST 
            ? `${URL_SERVIDOR}/rest/v1/examenes?id=eq.${preguntaId}` 
            : `${URL_SERVIDOR}/api/admin/examenes/pregunta/${preguntaId}`;

        await fetch(endpoint, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(() => {});

        btn.className = "bg-emerald-600 text-white text-[11px] font-bold px-4 py-2 rounded-xl uppercase tracking-wider transition-all duration-300 shadow-sm flex items-center gap-1.5";
        btn.innerText = "✓ ¡Guardado!";
        setTimeout(() => {
            btn.className = "bg-med-jade hover:opacity-90 text-white text-[11px] font-bold px-4 py-2 rounded-xl uppercase tracking-wider transition-all duration-300 shadow-sm flex items-center gap-1.5 active:scale-95";
            btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Guardar Cambios`;
            btn.disabled = false;
        }, 1500);

    } catch(e) {
        console.error(e);
        btn.disabled = false;
        btn.innerText = "Guardar Cambios";
    }
}

// ELIMINAR UNA PREGUNTA INDIVIDUAL
async function eliminarPreguntaUnica(preguntaId) {
    if (!confirm("¿Eliminar este reactivo del banco de preguntas?")) return;
    
    try {
        examenesGlobales = examenesGlobales.filter(p => p.id !== preguntaId);
        localStorage.setItem('atlas_examenes_local', JSON.stringify(examenesGlobales));

        const endpoint = USE_SUPABASE_REST 
            ? `${URL_SERVIDOR}/rest/v1/examenes?id=eq.${preguntaId}` 
            : `${URL_SERVIDOR}/api/admin/examenes/pregunta/${preguntaId}`;

        await fetch(endpoint, { method: 'DELETE' }).catch(() => {});

        const el = document.getElementById(`card-pregunta-${preguntaId}`);
        if (el) {
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(() => el.remove(), 300);
        }
    } catch(e) {
        console.error(e);
    }
}

// --- MODO SIMULADOR (INTERFAZ EXAMEN) ---
async function abrirSimulador(grupoId) {
    preguntasSimulador = examenesGlobales.filter(p => (p.grupo_id || 'antiguo') === grupoId);
    
    if (!preguntasSimulador.length) return alert("No existen preguntas en este simulador.");
    
    indexSimulador = 0;
    puntajeSimulador = 0;
    document.getElementById('sim-titulo').innerText = preguntasSimulador[0].nombre_personalizado || 'Examen Simulado';
    document.getElementById('modo-simulador').classList.add('activo');
    document.body.style.overflow = 'hidden';
    cargarPreguntaSimulador();
}

function cerrarSimulador() {
    document.getElementById('modo-simulador').classList.remove('activo');
    document.body.style.overflow = 'auto';
    cargarExamenes();
}

function cargarPreguntaSimulador() {
    respondidaSimulador = false;
    const p = preguntasSimulador[indexSimulador];
    const alternativas = Array.isArray(p.alternativas) ? p.alternativas : JSON.parse(p.alternativas || '[]');
    
    document.getElementById('sim-progreso').innerText = `${indexSimulador + 1} / ${preguntasSimulador.length}`;
    document.getElementById('sim-pregunta').innerText = p.texto_pregunta;
    
    const altsCont = document.getElementById('sim-alternativas');
    altsCont.innerHTML = alternativas.map((alt, j) => `
        <div class="alternativa w-full" onclick="responderSimulador(this, ${j}, ${p.correcta})">
            <span class="w-7 h-7 rounded-lg bg-med-accent border border-med-border font-serif text-med-blue font-bold flex items-center justify-center mr-3 text-sm shrink-0">
                ${String.fromCharCode(65+j)}
            </span> 
            <span class="flex-1">${escapeHtml(alt)}</span>
        </div>
    `).join('');
    
    document.getElementById('sim-panel-respuesta').classList.remove('abierto');
    document.getElementById('btn-siguiente').classList.add('hidden');
}

function responderSimulador(el, elegida, correcta) {
    if (respondidaSimulador) return;
    respondidaSimulador = true;
    
    const alts = document.getElementById('sim-alternativas').querySelectorAll('.alternativa');
    alts.forEach((alt, i) => {
        alt.classList.add('bloqueada');
        if (i === correcta) alt.classList.add('correcta');
        else if (i === elegida) alt.classList.add('incorrecta');
    });
    
    if (elegida === correcta) puntajeSimulador++;
    
    const p = preguntasSimulador[indexSimulador];
    const alternativas = Array.isArray(p.alternativas) ? p.alternativas : JSON.parse(p.alternativas || '[]');
    document.getElementById('sim-texto-correcta').innerText = alternativas[correcta];
    
    document.getElementById('sim-panel-respuesta').classList.add('abierto');
    document.getElementById('btn-siguiente').classList.remove('hidden');
}

function siguientePregunta() {
    indexSimulador++;
    if (indexSimulador < preguntasSimulador.length) {
        cargarPreguntaSimulador();
    } else {
        mostrarResultadoFinal();
    }
}

function mostrarResultadoFinal() {
    const total = preguntasSimulador.length;
    const porcentaje = Math.round((puntajeSimulador / total) * 100);
    
    document.querySelector('#modo-simulador .max-w-3xl').innerHTML = `
        <div class="flex-1 flex flex-col justify-center items-center text-center animate-fade-up my-auto py-8">
            <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-full border-4 border-med-jade flex items-center justify-center mb-6 bg-med-accent shadow-xl relative">
                <span class="text-4xl sm:text-5xl font-bold font-serif text-med-jade">${porcentaje}%</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-serif text-med-blue font-bold mb-2">Simulación Finalizada</h2>
            <p class="text-med-subtext text-sm sm:text-base mb-8 max-w-md">Has respondido correctamente <strong class="text-med-text">${puntajeSimulador}</strong> de <strong class="text-med-text">${total}</strong> reactivos evaluados.</p>
            
            <button onclick="cerrarSimulador()" class="bg-med-blue hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-xl uppercase tracking-wider text-xs transition-all shadow-lg hover:-translate-y-0.5 active:scale-95">
                Volver al Archivo
            </button>
        </div>
    `;
}

// UTILIDAD ESCAPE HTML
function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
