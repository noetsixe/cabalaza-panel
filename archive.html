<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Clínico | Premium Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'med-bg': '#f0f7ff',       // Fondo celeste muy claro
                        'med-dark': '#1e3a8a',     // Azul profundo para textos
                        'med-cyan': '#0ea5e9',     // Celeste brillante (acentos)
                        'med-light': '#e0f2fe',    // Celeste pastel (etiquetas)
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f0f7ff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(200, 100%, 90%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(190, 100%, 95%, 1) 0, transparent 50%);
            color: #1e293b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Tarjetas con efecto de cristal celeste */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(14, 165, 233, 0.15);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            box-shadow: 0 20px 50px -10px rgba(14, 165, 233, 0.25);
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.3);
        }

        /* Alternativas elegantes */
        .alternativa {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(14, 165, 233, 0.1);
            border-radius: 16px;
            padding: 18px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: #334155;
            font-weight: 500;
        }

        .alternativa:hover:not(.bloqueada) {
            background: #ffffff;
            border-color: #0ea5e9;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.1);
            transform: scale(1.01);
        }

        .alternativa.correcta {
            background: #ecfdf5;
            border-color: #10b981;
            color: #047857;
            font-weight: 600;
        }

        .alternativa.incorrecta {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .alternativa.bloqueada { cursor: default; }

        /* Panel de respuesta suave */
        .panel-correcta {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            margin-top: 0;
        }
        .panel-correcta.abierto {
            max-height: 400px;
            opacity: 1;
            margin-top: 24px;
        }

        /* Inputs estilo clínico */
        .input-clinico {
            background: transparent;
            border-bottom: 2px dashed rgba(14, 165, 233, 0.3);
            color: #1e3a8a;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-clinico:focus, .input-clinico:hover {
            border-bottom: 2px solid #0ea5e9;
        }

        .input-sub {
            background: transparent;
            border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            color: #0ea5e9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            outline: none;
            width: 100%;
            transition: all 0.3s;
        }

        .input-sub:focus, .input-sub:hover {
            border-bottom: 1px solid #0ea5e9;
        }

        /* Animaciones fluidas */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="p-6 md:p-12">

<div class="max-w-6xl mx-auto space-y-12">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-8 border-b border-blue-200/50 animate-fade-up">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-400 to-cyan-300 flex items-center justify-center shadow-lg shadow-blue-200/50 animate-float">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div>
                <p class="text-med-cyan tracking-[0.2em] text-xs font-bold uppercase mb-1">Clinical Premium</p>
                <h1 class="text-4xl md:text-5xl font-serif text-med-dark">Atlas Médico</h1>
            </div>
        </div>
        <a href="index.html" class="bg-white hover:bg-slate-50 text-med-dark text-sm font-semibold px-6 py-3 rounded-xl shadow-sm border border-blue-100 transition-all flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver al Panel
        </a>
    </header>

    <!-- Grid de Exámenes -->
    <div id="vista-examenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-20 text-med-cyan font-serif italic text-xl animate-pulse">
            Cargando expedientes clínicos...
        </div>
    </div>

    <!-- Vista de Preguntas -->
    <div id="vista-preguntas" class="hidden space-y-8"></div>

</div>

<script>
const URL_SERVIDOR = "https://api.nova-sync.xyz";

window.onload = () => {
    cargarExamenes();
};

async function cargarExamenes() {
    const cont = document.getElementById('vista-examenes');
    try {
        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
        const preguntas = await res.json();
        
        if (!preguntas.length) {
            cont.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 font-serif italic text-xl">No hay exámenes en el archivo.</div>';
            return;
        }

        const grupos = {};
        preguntas.forEach(p => {
            const id = p.grupo_id || 'antiguo';
            if (!grupos[id]) {
                grupos[id] = { 
                    id: id, 
                    total: 0, 
                    nombre: p.nombre_personalizado || 'Examen sin título',
                    materia: p.materia_personalizada || p.materia || 'General',
                    fecha: new Date().toLocaleDateString()
                };
            }
            grupos[id].total++;
        });

        cont.innerHTML = Object.entries(grupos).map(([id, data], index) => `
            <div class="glass-card p-8 flex flex-col justify-between h-64 group animate-fade-up relative" style="animation-delay: ${index * 0.1}s">
                
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 rounded-2xl bg-med-light flex items-center justify-center text-med-cyan">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="bg-white/80 text-med-dark text-xs font-bold px-3 py-1.5 rounded-full shadow-sm border border-blue-50">${data.total} preguntas</span>
                </div>

                <div class="flex-1 mb-6">
                    <div class="flex items-center gap-2 mb-1">
                        <input type="text" id="nombre-${id}" value="${data.nombre}" 
                            class="input-clinico" placeholder="Nombre del examen"
                            onchange="guardarTitulo('${id}', this.value, 'nombre')">
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="materia-${id}" value="${data.materia}" 
                            class="input-sub" placeholder="Especialidad"
                            onchange="guardarTitulo('${id}', this.value, 'materia')">
                        <svg class="w-3 h-3 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <p class="text-[11px] font-medium text-slate-400 mt-3 uppercase tracking-wider">${data.fecha}</p>
                </div>
                
                <button onclick="abrirExamen('${id}')" class="w-full bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white text-sm font-bold py-3 rounded-xl shadow-md shadow-blue-200 transition-all transform hover:-translate-y-0.5">
                    Abrir Expediente
                </button>
            </div>
        `).join('');
    } catch(e) { 
        cont.innerHTML = '<div class="col-span-full text-center text-red-500 py-10 font-serif">Error de conexión con la base de datos.</div>'; 
    }
}

async function guardarTitulo(grupoId, nuevoTexto, tipo) {
    try {
        const body = {};
        if (tipo === 'nombre') body.nombre_personalizado = nuevoTexto;
        if (tipo === 'materia') body.materia_personalizada = nuevoTexto;

        const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes/${grupoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Error al guardar');
        
        const input = document.getElementById(`${tipo}-${grupoId}`);
        input.classList.add('text-green-500');
        setTimeout(() => input.classList.remove('text-green-500'), 1000);

    } catch (e) {
        console.error(e);
    }
}

async function abrirExamen(grupoId) {
    document.getElementById('vista-examenes').classList.add('hidden');
    const cont = document.getElementById('vista-preguntas');
    cont.classList.remove('hidden');
    cont.innerHTML = '<div class="text-center py-20 text-med-cyan font-serif italic text-xl animate-pulse">Abriendo expediente...</div>';

    const res = await fetch(`${URL_SERVIDOR}/api/admin/examenes`);
    const preguntas = (await res.json()).filter(p => (p.grupo_id || 'antiguo') === grupoId);

    cont.innerHTML = `
        <div class="flex items-center gap-4 mb-8 animate-fade-up">
            <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-med-dark text-sm font-semibold px-5 py-2.5 rounded-xl shadow-sm border border-blue-100 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver a los exámenes
            </button>
        </div>
        
        <div class="mb-10 pl-6 border-l-4 border-med-cyan animate-fade-up">
            <h2 class="text-3xl md:text-4xl font-serif text-med-dark">${preguntas[0].nombre_personalizado || 'Detalle del Examen'}</h2>
            <p class="text-med-cyan mt-2 text-sm font-bold tracking-wide uppercase">${preguntas[0].materia_personalizada || preguntas[0].materia} • ${preguntas.length} preguntas</p>
        </div>
        
        <div class="space-y-8">
            ${preguntas.map((p, i) => `
                <div class="glass-card p-8 md:p-10 animate-fade-up" id="p${i}" style="animation-delay: ${i * 0.05}s">
                    <div class="mb-6 flex gap-4">
                        <span class="text-med-cyan font-serif italic text-2xl mt-1">Q${i + 1}.</span>
                        <h3 class="text-lg md:text-xl text-med-dark font-medium leading-relaxed">${p.texto_pregunta}</h3>
                    </div>
                    
                    <div class="space-y-3 mt-8 pl-0 md:pl-12">
                        ${p.alternativas.map((alt, j) => `
                            <div class="alternativa flex items-start gap-4" data-idx="${j}" data-c="${p.correcta}" onclick="responder(this)">
                                <span class="font-serif text-med-cyan font-bold mt-0.5">${String.fromCharCode(65+j)}.</span>
                                <span>${alt}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-8 pt-6 border-t border-blue-100 flex justify-end pl-0 md:pl-12">
                        <button onclick="verCorrecta('p${i}')" class="text-xs font-bold tracking-widest text-med-cyan hover:text-blue-600 uppercase transition-colors flex items-center gap-2 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg border border-blue-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Revelar respuesta
                        </button>
                    </div>
                    
                    <div class="panel-correcta pl-0 md:pl-12" id="panel-p${i}">
                        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-6 rounded-2xl flex items-start gap-4 shadow-sm">
                            <svg class="w-6 h-6 text-emerald-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <div>
                                <h4 class="text-emerald-600 font-bold text-sm tracking-wider uppercase mb-1">Respuesta Correcta</h4>
                                <p class="text-emerald-900 font-serif text-lg">${p.alternativas[p.correcta]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function responder(el) {
    const cont = el.closest('[id^="p"]');
    const alts = cont.querySelectorAll('.alternativa');
    if (alts[0].classList.contains('bloqueada')) return;
    
    const idxElegido = parseInt(el.dataset.idx);
    const idxCorrecta = parseInt(el.dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
        else if (i === idxElegido) a.classList.add('incorrecta');
    });
    
    document.getElementById('panel-' + cont.id).classList.add('abierto');
}

function verCorrecta(id) {
    const cont = document.getElementById(id);
    const alts = cont.querySelectorAll('.alternativa');
    const idxCorrecta = parseInt(alts[0].dataset.c);
    
    alts.forEach((a, i) => {
        a.classList.add('bloqueada');
        if (i === idxCorrecta) a.classList.add('correcta');
    });
    
    document.getElementById('panel-' + id).classList.add('abierto');
}
</script>
</body>
</html>
