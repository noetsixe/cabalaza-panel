<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Servidor Exámenes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Panel de Control</h1>
                <p class="text-sm text-gray-500">Gestión de usuarios y estado del servidor</p>
            </div>
            <button onclick="verificarEstado()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700 transition">
                Actualizar Estado
            </button>
        </header>

        <!-- Estado del Servidor -->
        <div id="caja-estado" class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r-lg text-yellow-700">
            Comprobando conexión con el servidor...
        </div>

        <!-- Sección de Gestión de Usuarios -->
        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Usuarios Registrados</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-3 text-sm font-semibold text-gray-600">Usuario / ID</th>
                            <th class="p-3 text-sm font-semibold text-gray-600">Estado de Acceso</th>
                            <th class="p-3 text-sm font-semibold text-gray-600 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                        <tr class="border-b">
                            <td class="p-3 text-gray-500" colspan="3">Cargando lista de usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL exacta de tu servidor backend en Render
        const URL_SERVIDOR = "https://servidor-examenes.onrender.com";

        window.onload = function() {
            verificarEstado();
            cargarUsuarios();
            notificarServidorPanel(); // <--- Envía la señal al servidor al abrir la página
        };

        // Función para notificar al servidor que el panel se abrió
        async function notificarServidorPanel() {
            try {
                await fetch(`${URL_SERVIDOR}/api/admin/ping`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento: "panel_abierto" })
                });
            } catch (e) {
                console.log("No se pudo notificar al servidor");
            }
        }

        async function verificarEstado() {
            const caja = document.getElementById('caja-estado');
            caja.className = "bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r-lg text-yellow-700";
            caja.innerHTML = "Comprobando servidor (si está inactivo, puede tardar unos segundos)...";

            try {
                // Modificado para usar la nueva ruta de estado específica para el panel
                const res = await fetch(`${URL_SERVIDOR}/api/admin/status`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    caja.className = "bg-green-50 border-l-4 border-green-400 p-4 mb-6 rounded-r-lg text-green-700";
                    caja.innerHTML = "<strong>Servidor en línea:</strong> Operando y conectado correctamente.";
                } else {
                    throw new Error();
                }
            } catch (e) {
                caja.className = "bg-red-50 border-l-4 border-red-400 p-4 mb-6 rounded-r-lg text-red-700";
                caja.innerHTML = "<strong>Servidor durmiendo o desconectado:</strong> Espera unos segundos a que despierte la instancia gratuita de Render.";
            }
        }

        async function cargarUsuarios() {
            const tabla = document.getElementById('tabla-usuarios');
            const usuarios = [
                { id: "nonetsixe", activo: true },
                { id: "lu", activo: true }
            ];

            tabla.innerHTML = "";
            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3 font-medium text-gray-800">${u.id}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs ${u.activo ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${u.activo ? 'Activo' : 'Desactivado'}
                            </span>
                        </td>
                        <td class="p-3 text-right">
                            <button onclick="alert('Para modificar este usuario de forma permanente, actualiza el objeto USERS_DB en tu servidor de GitHub.')" class="px-3 py-1 rounded text-white text-sm bg-gray-600 hover:bg-gray-700">
                                Gestionar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
