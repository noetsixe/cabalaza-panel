<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL // EXAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #b91c1c;
            font-family: 'Special Elite', monospace, sans-serif;
        }
        .font-terminal {
            font-family: 'VT323', monospace;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 selection:bg-red-950 selection:text-red-300">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Cabecera estilo Blog/Zine -->
        <header class="bg-black border-2 border-red-600 p-6 shadow-[4px_4px_0px_0px_#dc2626] flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-widest text-red-600 uppercase flex items-center gap-2">
                    <span class="inline-block w-3 h-3 bg-red-600 animate-pulse"></span>
                    PANEL_DE_CONTROL
                </h1>
                <p class="text-xs text-neutral-500 font-terminal tracking-wider mt-1">// GESTIÓN DE ACCESOS Y ESTADO DEL SISTEMA</p>
            </div>
            <button onclick="verificarEstado()" class="bg-red-600 hover:bg-red-700 text-black font-bold text-xs px-4 py-2 border border-red-500 shadow-[2px_2px_0px_0px_#ffffff] transition uppercase tracking-widest cursor-pointer">
                Actualizar Estado
            </button>
        </header>

        <!-- Estado del Servidor -->
        <div id="caja-estado" class="bg-black border-2 border-neutral-800 p-4 text-neutral-400 text-sm flex items-center gap-3">
            <span class="w-2.5 h-2.5 bg-yellow-500 animate-ping"></span>
            Comprobando conexión con el servidor...
        </div>

        <!-- Sección de Gestión de Usuarios -->
        <div class="bg-black border-2 border-neutral-800 p-6 shadow-[4px_4px_0px_0px_#262626]">
            <h2 class="text-xs font-bold uppercase tracking-widest text-red-500 mb-4 border-b border-neutral-800 pb-2">
                &gt;&gt; USUARIOS REGISTRADOS [DATABASE]
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-neutral-800 text-neutral-600 text-xs tracking-wider">
                            <th class="py-3 px-2">USUARIO / ID</th>
                            <th class="py-3 px-2">ESTADO DE ACCESO</th>
                            <th class="py-3 px-2 text-right">ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="divide-y divide-neutral-900 text-sm">
                        <tr>
                            <td class="py-4 px-2 text-neutral-700 font-terminal text-lg" colspan="3">&gt; Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL exacta de tu servidor backend en Render
        const URL_SERVIDOR = "https://servidor-examenes.onrender.com";

        window.onload = function() {
            verificarEstado();
            cargarUsuarios();
            notificarServidorPanel(); 
        };

        async function notificarServidorPanel() {
            try {
                await fetch(`${URL_SERVIDOR}/api/admin/ping`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento: "panel_abierto" })
                });
            } catch (e) {
                console.log("No se pudo notificar al servidor");
            }
        }

        async function verificarEstado() {
            const caja = document.getElementById('caja-estado');
            caja.className = "bg-black border-2 border-neutral-800 p-4 text-neutral-400 text-sm flex items-center gap-3";
            caja.innerHTML = `<span class="w-2.5 h-2.5 bg-yellow-500 animate-ping"></span> Comprobando servidor (puede tardar si la instancia duerme)...`;

            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/status`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    caja.className = "bg-black border-2 border-red-900/60 p-4 text-red-500 text-sm flex items-center gap-3 shadow-[0_0_10px_rgba(220,38,38,0.1)]";
                    caja.innerHTML = `<span class="w-2.5 h-2.5 bg-red-600 shadow-[0_0_8px_#dc2626]"></span> <strong>SISTEMA ONLINE:</strong> Servidor operando correctamente.`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                caja.className = "bg-black border-2 border-neutral-800 p-4 text-neutral-600 text-sm flex items-center gap-3";
                caja.innerHTML = `<span class="w-2.5 h-2.5 bg-neutral-700"></span> <strong>SISTEMA OFFLINE:</strong> Esperando respuesta del servidor gratuito...`;
            }
        }

        async function cargarUsuarios() {
            const tabla = document.getElementById('tabla-usuarios');
            const usuarios = [
                { id: "nonetsixe", activo: true },
                { id: "lu", activo: true }
            ];

            tabla.innerHTML = "";
            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr class="hover:bg-neutral-950 transition">
                        <td class="py-4 px-2 font-terminal text-lg tracking-wider text-neutral-300">${u.id}</td>
                        <td class="py-4 px-2">
                            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs font-terminal tracking-wider ${u.activo ? 'text-red-500 bg-red-950/40 border border-red-900/40' : 'text-neutral-600 bg-neutral-900 border border-neutral-800'}">
                                <span class="w-1.5 h-1.5 ${u.activo ? 'bg-red-600 animate-pulse' : 'bg-neutral-700'}"></span>
                                ${u.activo ? 'ACTIVO (🩸)' : 'INACTIVO'}
                            </span>
                        </td>
                        <td class="py-4 px-2 text-right">
                            <button onclick="alert('Para modificar este usuario, actualiza el objeto USERS_DB en tu repositorio de GitHub.')" class="px-3 py-1 text-xs font-terminal tracking-wider text-neutral-400 bg-neutral-900 hover:bg-red-600 hover:text-black border border-neutral-700 transition uppercase">
                                Gestionar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
