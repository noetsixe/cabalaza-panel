<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración // Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #d1d5db;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="min-h-screen p-6 selection:bg-zinc-800 selection:text-white">
    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <header class="bg-zinc-900 border border-zinc-800 shadow-2xl rounded-xl p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wider text-zinc-100 flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    PANEL_DE_CONTROL
                </h1>
                <p class="text-xs text-zinc-500 mt-1">Gestión de usuarios y estado del servidor</p>
            </div>
            <button onclick="verificarEstado()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 text-xs px-4 py-2 rounded-lg shadow transition tracking-wide uppercase">
                Actualizar Estado
            </button>
        </header>

        <!-- Estado del Servidor -->
        <div id="caja-estado" class="bg-zinc-900 border border-zinc-800 p-4 mb-6 rounded-xl text-zinc-400 text-sm flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-yellow-500 animate-ping"></span>
            Comprobando conexión con el servidor...
        </div>

        <!-- Sección de Gestión de Usuarios -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-2xl mb-6">
            <h2 class="text-sm uppercase tracking-widest text-zinc-400 font-semibold mb-4 border-b border-zinc-800 pb-2">
                Usuarios Registrados
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-zinc-500 text-xs uppercase tracking-wider">
                            <th class="py-3 px-2">Usuario / ID</th>
                            <th class="py-3 px-2">Estado de Acceso</th>
                            <th class="py-3 px-2 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="divide-y divide-zinc-800/50 text-sm">
                        <tr>
                            <td class="py-4 px-2 text-zinc-600" colspan="3">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL exacta de tu servidor backend en Render
        const URL_SERVIDOR = "https://servidor-examenes.onrender.com";

        window.onload = function() {
            verificarEstado();
            cargarUsuarios();
            notificarServidorPanel(); // Envía la señal al servidor al abrir la página
        };

        // Función para notificar al servidor que el panel se abrió
        async function notificarServidorPanel() {
            try {
                await fetch(`${URL_SERVIDOR}/api/admin/ping`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento: "panel_abierto" })
                });
            } catch (e) {
                console.log("No se pudo notificar al servidor");
            }
        }

        async function verificarEstado() {
            const caja = document.getElementById('caja-estado');
            caja.className = "bg-zinc-900 border border-zinc-800 p-4 mb-6 rounded-xl text-zinc-400 text-sm flex items-center gap-3";
            caja.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 animate-ping"></span> Comprobando servidor (si está inactivo, puede tardar unos segundos)...`;

            try {
                // Consulta la ruta de estado específica del panel para imprimir el log correcto
                const res = await fetch(`${URL_SERVIDOR}/api/admin/status`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    caja.className = "bg-zinc-900 border border-emerald-900/50 p-4 mb-6 rounded-xl text-emerald-400 text-sm flex items-center gap-3 shadow-[0_0_15px_rgba(16,185,129,0.05)]";
                    caja.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span> <strong>Servidor en línea:</strong> Operando y conectado correctamente.`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                caja.className = "bg-zinc-900 border border-rose-900/50 p-4 mb-6 rounded-xl text-rose-400 text-sm flex items-center gap-3 shadow-[0_0_15px_rgba(244,63,94,0.05)]";
                caja.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> <strong>Servidor durmiendo o desconectado:</strong> Espera unos segundos a que despierte la instancia gratuita de Render.`;
            }
        }

        async function cargarUsuarios() {
            const tabla = document.getElementById('tabla-usuarios');
            const usuarios = [
                { id: "nonetsixe", activo: true },
                { id: "lu", activo: true }
            ];

            tabla.innerHTML = "";
            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr class="hover:bg-zinc-800/40 transition">
                        <td class="py-4 px-2 font-mono text-zinc-200">${u.id}</td>
                        <td class="py-4 px-2">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-mono ${u.activo ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/50' : 'bg-rose-950/60 text-rose-400 border border-rose-800/50'}">
                                <span class="w-1.5 h-1.5 rounded-full ${u.activo ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
                                ${u.activo ? 'ACTIVO' : 'INACTIVO'}
                            </span>
                        </td>
                        <td class="py-4 px-2 text-right">
                            <button onclick="alert('Para modificar este usuario de forma permanente, actualiza el objeto USERS_DB en tu servidor de GitHub.')" class="px-3 py-1.5 rounded-lg text-xs font-mono text-zinc-300 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 transition">
                                Gestionar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
