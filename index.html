<script>
        // CONFIGURACIÓN GLOBAL
        const URL_SERVIDOR = "https://servidor-examenes.onrender.com";
        let listaUsuariosCache = []; 
        let estadoDeseadoSwitch = false; 
        let adminToken = null;
        let pendingAction = null;

        // INTERCEPTOR DE FETCH PARA AÑADIR AUTENTICACIÓN
        const rawFetch = window.fetch.bind(window);
        window.fetch = async (input, init = {}) => {
            const url = typeof input === 'string' ? input : input.url;
            if (url.startsWith(`${URL_SERVIDOR}/api/admin`)) {
                const headers = new Headers(init.headers || {});
                if (adminToken) headers.set('Authorization', `Bearer ${adminToken}`);
                return rawFetch(input, { ...init, headers });
            }
            return rawFetch(input, init);
        };

        // INICIALIZACIÓN
        window.onload = function() {
            abrirModal('Introduce la contraseña de administrador para acceder al panel:', async () => {
                actualizarTodo();
                notificarServidorPanel(); 
                setInterval(cargarLogsPreguntas, 5000);
                setInterval(cargarUsuariosActivos, 3000);
                setInterval(verificarEstadoServidorSwitch, 10000);
            });
        };

        // GESTIÓN DE MODAL Y LOGIN
        function abrirModal(texto, accion) {
            pendingAction = accion;
            const pModal = document.querySelector('#modal-password p');
            if (pModal) pModal.textContent = texto;
            const input = document.getElementById('input-admin-pass');
            input.value = '';
            document.getElementById('modal-password').classList.remove('hidden');
            input.focus();
        }

        function cerrarModalPassword() {
            document.getElementById('modal-password').classList.add('hidden');
            pendingAction = null;
            if (adminToken) verificarEstadoServidorSwitch();
        }

        async function ejecutarCambioServidor() {
            const passwordIngresada = document.getElementById('input-admin-pass').value;
            if (!passwordIngresada) return alert("Debes introducir la contraseña.");

            try {
                // Autenticar primero si no hay token
                if (!adminToken) {
                    const res = await rawFetch(`${URL_SERVIDOR}/api/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: passwordIngresada })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.token) return alert(data.error || "Contraseña incorrecta.");
                    adminToken = data.token;
                }

                document.getElementById('modal-password').classList.add('hidden');
                
                // Ejecutar la acción pendiente
                const accion = pendingAction;
                pendingAction = null;
                if (accion) await accion();
            } catch (e) {
                alert("Error al conectar con el servidor de autenticación.");
            }
        }

        function intentarCambiarEstado(event) {
            event.preventDefault(); 
            const checkbox = document.getElementById('main-server-switch');
            estadoDeseadoSwitch = !checkbox.checked; 

            abrirModal('Introduce la contraseña para cambiar el estado del servidor:', ejecutarToggleServidorBackend);
        }

        async function ejecutarToggleServidorBackend() {
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/toggle-server`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ active: estadoDeseadoSwitch })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    const checkbox = document.getElementById('main-server-switch');
                    const labelTexto = document.getElementById('label-estado-texto');
                    
                    checkbox.checked = data.active;
                    actualizarEfectosVisuales(data.active, true);

                    if (data.active) {
                        labelTexto.innerText = "ENCENDIDO 🟢";
                        labelTexto.className = "text-[10px] font-bold text-green-400 uppercase tracking-widest animate-pulse";
                    } else {
                        labelTexto.innerText = "APAGADO 🔴";
                        labelTexto.className = "text-[10px] font-bold text-red-500 uppercase tracking-widest";
                    }
                } else {
                    alert(data.error || "No se pudo cambiar el estado del servidor.");
                    verificarEstadoServidorSwitch();
                }
            } catch (e) {
                alert("Error de conexión al intentar cambiar el estado del servidor.");
                verificarEstadoServidorSwitch();
            }
        }

        // EFECTO MATRIX ANIMADO
        (function iniciarMatrix() {
            const canvas = document.getElementById('canvas-matrix');
            const ctx = canvas.getContext('2d');
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-/<>[]{}';
            const fontSize = 14;
            let columnas = 0;
            let gotas = [];

            function meAjustarTamano() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const nuevasColumnas = Math.floor(canvas.width / fontSize);
                if (nuevasColumnas !== columnas) {
                    const viejasGotas = gotas;
                    gotas = new Array(nuevasColumnas);
                    for (let i = 0; i < nuevasColumnas; i++) {
                        gotas[i] = viejasGotas[i] !== undefined ? viejasGotas[i] : Math.floor(Math.random() * -20);
                    }
                    columnas = nuevasColumnas;
                }
            }

            meAjustarTamano();
            window.addEventListener('resize', meAjustarTamano);

            let lastTime = 0;
            const fps = 30;
            const interval = 1000 / fps;

            function render(currentTime) {
                requestAnimationFrame(render);
                const delta = currentTime - lastTime;
                if (delta < interval) return;
                lastTime = currentTime - (delta % interval);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#dc2626';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < gotas.length; i++) {
                    const char = caracteres.charAt(Math.floor(Math.random() * caracteres.length));
                    const x = i * fontSize;
                    const y = gotas[i] * fontSize;
                    if (y > 0) ctx.fillText(char, x, y);
                    if (y > canvas.height && Math.random() > 0.975) gotas[i] = 0;
                    gotas[i]++;
                }
            }
            requestAnimationFrame(render);
        })();

        // FUNCIONES DE INTERFAZ Y EFECTOS
        function efectoCalabazaVibrar(e) {
            e.stopPropagation();
            const calabaza = document.getElementById('img-calabaza');
            const switchEstado = document.getElementById('main-server-switch');
            const root = document.documentElement;

            calabaza.classList.add('vibrar-calabaza');
            const motorActivo = switchEstado.checked;
            if (motorActivo) {
                root.classList.add('modo-invertido');
                document.body.classList.add('temblor-pantalla');
            }

            setTimeout(() => {
                calabaza.classList.remove('vibrar-calabaza');
                if (motorActivo) {
                    root.classList.remove('modo-invertido');
                    document.body.classList.remove('temblor-pantalla');
                }
            }, 250);
        }

        function actualizarEfectosVisuales(activo, reproducirAnimacion = false) {
            const elementosAfectados = document.querySelectorAll('.motor-afectado');
            const overlay = document.getElementById('pixel-flash-overlay');

            if (reproducirAnimacion) {
                overlay.classList.remove('flash-anim-on', 'flash-anim-off');
                void overlay.offsetWidth;
                overlay.classList.add(activo ? 'flash-anim-on' : 'flash-anim-off');
            }

            elementosAfectados.forEach(el => {
                if (activo) el.classList.remove('filtro-gris');
                else el.classList.add('filtro-gris');
            });
        }

        function actualizarTodo() {
            verificarEstado();
            verificarEstadoServidorSwitch();
            cargarUsuarios();
            cargarUsuariosActivos();
            cargarLogsPreguntas();
        }

        // COMUNICACIÓN CON EL BACKEND
        async function notificarServidorPanel() {
            try {
                await fetch(`${URL_SERVIDOR}/api/admin/ping`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento: "panel_abierto" })
                });
            } catch (e) {
                console.log("No se pudo notificar al servidor");
            }
        }

        async function cargarUsuariosActivos() {
            if (!adminToken) return;
            const contenedor = document.getElementById('contenedor-usuarios-activos');
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/active-users`);
                if (res.ok) {
                    const activos = await res.json();
                    if (activos && activos.length > 0) {
                        contenedor.innerHTML = "";
                        activos.forEach(u => {
                            let badgeColor = "border-cyan-500 text-cyan-400 bg-cyan-950/40";
                            if (u.ubicacion.includes("UDABOL")) badgeColor = "border-red-500 text-red-400 bg-red-950/40";
                            else if (u.ubicacion.includes("Test")) badgeColor = "border-yellow-500 text-yellow-400 bg-yellow-950/40";

                            contenedor.innerHTML += `
                                <div class="bg-black border border-neutral-800 p-3 flex justify-between items-center font-terminal text-[10px]">
                                    <div class="flex items-center gap-2">
                                        <span class="w-2 h-2 bg-green-500 animate-ping rounded-full"></span>
                                        <span class="text-pink-400 font-bold">${u.usuario}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="px-2 py-0.5 border ${badgeColor} text-[9px] uppercase tracking-wider">${u.ubicacion}</span>
                                        <span class="text-neutral-500 text-[9px]">hace ${u.haceCuanto}s</span>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        contenedor.innerHTML = `<div class="text-neutral-500 font-terminal text-xs">&gt; Ningún usuario activo en este momento.</div>`;
                    }
                }
            } catch (e) {
                contenedor.innerHTML = `<div class="text-neutral-600 font-terminal text-[10px]">&gt; Error obteniendo usuarios activos.</div>`;
            }
        }

        async function verificarEstadoServidorSwitch() {
            if (!adminToken) return;
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/server-status`);
                if (res.ok) {
                    const data = await res.json();
                    const checkbox = document.getElementById('main-server-switch');
                    const labelTexto = document.getElementById('label-estado-texto');
                    
                    checkbox.checked = data.active;
                    actualizarEfectosVisuales(data.active, false);

                    if (data.active) {
                        labelTexto.innerText = "ENCENDIDO 🟢";
                        labelTexto.className = "text-[10px] font-bold text-green-400 uppercase tracking-widest animate-pulse";
                    } else {
                        labelTexto.innerText = "APAGADO 🔴";
                        labelTexto.className = "text-[10px] font-bold text-red-500 uppercase tracking-widest";
                    }
                }
            } catch (e) {
                console.log("Error verificando el switch del servidor");
            }
        }

        async function verificarEstado() {
            if (!adminToken) return;
            const caja = document.getElementById('caja-estado');
            let clasesBase = "motor-afectado backdrop-blur-sm " + (caja.classList.contains('filtro-gris') ? 'filtro-gris ' : '');
            
            caja.className = clasesBase + "bg-black/90 border-2 border-neutral-700 p-3 text-neutral-300 text-xs flex items-center gap-3 flex-1";
            caja.innerHTML = `<span class="w-2.5 h-2.5 bg-yellow-500 animate-ping"></span> Comprobando servidor...`;

            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/status`);

                if (res.ok) {
                    caja.className = clasesBase + "bg-black/90 border-2 border-red-600 p-3 text-red-500 text-xs flex items-center gap-3 flex-1";
                    caja.innerHTML = `<span class="w-2.5 h-2.5 bg-red-600"></span> <strong class="text-cyan-400">SISTEMA ONLINE:</strong> <span class="text-green-400">Servidor operando correctamente.</span>`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                caja.className = clasesBase + "bg-black/90 border-2 border-neutral-800 p-3 text-neutral-500 text-xs flex items-center gap-3 flex-1";
                caja.innerHTML = `<span class="w-2.5 h-2.5 bg-neutral-600"></span> <strong>SISTEMA OFFLINE:</strong> Esperando respuesta del servidor...`;
            }
        }

        async function cargarLogsPreguntas() {
            if (!adminToken) return;
            const contenedor = document.getElementById('contenedor-logs');
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/logs`);

                if (res.ok) {
                    const logs = await res.json();
                    
                    if (logs && logs.length > 0) {
                        contenedor.innerHTML = "";
                        logs.reverse().forEach(log => {
                            let textoPregunta = log.pregunta || "";
                            let listaOpcionesHTML = "";

                            if (textoPregunta.includes("Opciones:")) {
                                let partes = textoPregunta.split("Opciones:");
                                textoPregunta = partes[0].trim();
                                let opcionesTexto = partes[1].trim();
                                
                                let opcionesMatch = opcionesTexto.split(/(?=\d+\.-|\d+\.\s)/g).map(o => o.trim()).filter(o => o.length > 0);
                                opcionesMatch.reverse();

                                listaOpcionesHTML = `<div class="mt-2 space-y-1 pl-2 border-l border-cyan-700">
                                    <div class="text-[9px] text-cyan-300">// ALTERNATIVAS (ORDEN INVERTIDO):</div>`;
                                opcionesMatch.forEach(op => {
                                    listaOpcionesHTML += `<div class="text-green-400 font-terminal text-[10px]">🔹 ${op}</div>`;
                                });
                                listaOpcionesHTML += `</div>`;
                            }

                            let rawDataString = JSON.stringify(log);
                            for (let key in log) {
                                if (typeof log[key] === 'string') rawDataString += " " + log[key];
                                else if (typeof log[key] === 'object' && log[key] !== null) rawDataString += " " + JSON.stringify(log[key]);
                            }

                            let matchIntentoLiteral = rawDataString.match(/-->\s*Intento\s*\d+\s*\([^)]+\):\s*\[\s*['"]?\d['"]?,\s*['"]?\d['"]?,\s*['"]?\d['"]?\s*\]/i);
                            let intentoTextoLinea = matchIntentoLiteral ? matchIntentoLiteral[0].replace(/\\n/g, '').trim() : "--> Intento 1 (OpenAI, Gemini, Groq): [ '2', '2', '2' ]";

                            let matchConsensoLiteral = rawDataString.match(/Consenso\s*alcanzado\s*en\s*Intento\s*\d+:\s*\d+\s*\(\d+\/\d+\s*votos\)/i);
                            let consensoTextoLinea = matchConsensoLiteral ? matchConsensoLiteral[0].replace(/\\n/g, '').trim() : `Consenso alcanzado en Intento 1: ${log.respuesta || '2'} (3/3 votos)`;

                            contenedor.innerHTML += `
                                <div class="bg-black border border-red-800 p-3 text-[10px] space-y-2">
                                    <div class="flex justify-between text-neutral-300 font-terminal">
                                        <span>USER: <strong class="text-pink-400">${log.usuario || 'Anónimo'}</strong></span>
                                        <span class="text-cyan-400">[${log.fecha || 'Justo ahora'}]</span>
                                    </div>
                                    <div class="text-green-400 font-terminal text-xs">
                                        <strong class="text-red-500">Q:</strong> ${textoPregunta}
                                    </div>
                                    ${listaOpcionesHTML}
                                    <div class="mt-2 space-y-1 border-t border-red-950 pt-2 font-terminal text-[10px]">
                                        <div class="text-pink-400 font-bold">${consensoTextoLinea}</div>
                                        <div class="text-cyan-300">${intentoTextoLinea}</div>
                                    </div>
                                    <div class="text-neutral-300 font-terminal text-xs border-t border-red-950 pt-2 flex justify-end">
                                        <div>
                                            <strong class="text-cyan-400">RESPUESTA:</strong> <span class="text-red-400 font-bold text-sm">${log.respuesta || 'N/A'}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        contenedor.innerHTML = `<div class="text-cyan-400 font-terminal text-xs">&gt; No hay preguntas registradas todavía en esta sesión.</div>`;
                    }
                }
            } catch (e) {
                contenedor.innerHTML = `<div class="text-red-500 font-terminal text-[10px]">&gt; Error al conectar con el servidor para obtener los logs.</div>`;
            }
        }

        async function cargarUsuarios() {
            if (!adminToken) return;
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/users`);
                if (res.ok) {
                    listaUsuariosCache = await res.json();
                    renderizarTablaUsuarios(listaUsuariosCache);
                } else {
                    throw new Error();
                }
            } catch (e) {
                const tabla = document.getElementById('tabla-usuarios');
                tabla.innerHTML = `<tr><td class="py-4 px-2 text-red-500 font-terminal text-xs" colspan="3">&gt; Error al cargar usuarios desde el servidor.</td></tr>`;
            }
        }

        function renderizarTablaUsuarios(usuarios) {
            const tabla = document.getElementById('tabla-usuarios');
            tabla.innerHTML = "";

            if (usuarios.length === 0) {
                tabla.innerHTML = `<tr><td class="py-4 px-2 text-neutral-500 font-terminal text-xs" colspan="3">&gt; No se encontraron registros.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr class="hover:bg-neutral-900 transition relative">
                        <td class="py-4 px-2 font-terminal text-xs tracking-wider text-pink-400">${u.id}</td>
                        <td class="py-4 px-2">
                            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 text-[10px] font-terminal tracking-wider ${u.activo ? 'text-red-500 bg-red-950 border border-red-800' : 'text-neutral-500 bg-black border border-neutral-800'}">
                                <span class="w-1.5 h-1.5 ${u.activo ? 'bg-red-600 animate-pulse' : 'bg-neutral-600'}"></span>
                                ${u.activo ? 'ACTIVO (🩸)' : 'INACTIVO'}
                            </span>
                        </td>
                        <td class="py-4 px-2 text-right relative">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="toggleUsuario('${u.id}')" class="px-3 py-1 text-[10px] font-terminal tracking-wider ${u.activo ? 'text-neutral-300 bg-black hover:bg-red-600 hover:text-black border border-neutral-700' : 'text-red-500 bg-red-950 hover:bg-red-600 hover:text-black border border-red-800'} transition uppercase cursor-pointer">
                                    ${u.activo ? 'Desactivar' : 'Activar'}
                                </button>
                                
                                <div class="relative inline-block text-left">
                                    <button onclick="toggleMenuPuntitos(event, '${u.id}')" class="p-1.5 text-neutral-400 hover:text-red-500 bg-neutral-900 hover:bg-black border border-neutral-700 font-bold cursor-pointer text-xs">
                                        ⋮
                                    </button>
                                    
                                    <div id="menu-${u.id}" class="hidden absolute right-0 mt-1 w-32 bg-black border-2 border-red-600 shadow-[4px_4px_0px_0px_#dc2626] z-30 text-left">
                                        <button onclick="eliminarUsuario('${u.id}')" class="w-full text-left px-3 py-2 text-[10px] text-red-500 hover:bg-red-950 hover:text-red-300 font-terminal transition flex items-center gap-1.5 cursor-pointer">
                                            <span>🗑️</span> Eliminar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function toggleMenuPuntitos(event, usuarioId) {
            event.stopPropagation();
            document.querySelectorAll('[id^="menu-"]').forEach(el => {
                if(el.id !== `menu-${usuarioId}`) el.classList.add('hidden');
            });

            const menu = document.getElementById(`menu-${usuarioId}`);
            if (menu) menu.classList.toggle('hidden');
        }

        function cerrarTodosLosMenus(event) {
            if (!event.target.closest('button')) {
                document.querySelectorAll('[id^="menu-"]').forEach(el => {
                    el.classList.add('hidden');
                });
            }
        }

        function filtrarUsuarios() {
            const textoFiltro = document.getElementById('buscador-usuarios').value.toLowerCase();
            const usuariosFiltrados = listaUsuariosCache.filter(u => u.id.toLowerCase().includes(textoFiltro));
            renderizarTablaUsuarios(usuariosFiltrados);
        }

        async function crearUsuario(event) {
            event.preventDefault();
            const inputId = document.getElementById('nuevo-usuario-id');
            const nuevoId = inputId.value.trim();

            if (!nuevoId) return;

            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/user/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: nuevoId })
                });

                if (res.ok) {
                    inputId.value = "";
                    cargarUsuarios();
                } else {
                    const data = await res.json();
                    alert(data.error || "No se pudo crear el usuario.");
                }
            } catch (e) {
                alert("Error de conexión al intentar crear el usuario.");
            }
        }

        async function toggleUsuario(usuarioId) {
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/user/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioId })
                });

                if (res.ok) {
                    cargarUsuarios();
                } else {
                    alert("No se pudo cambiar el estado del usuario.");
                }
            } catch (e) {
                alert("Error de conexión al intentar modificar el usuario.");
            }
        }

        async function eliminarUsuario(usuarioId) {
            if (!confirm(`¿Estás seguro de que deseas eliminar al usuario "${usuarioId}"?`)) return;

            try {
                const res = await fetch(`${URL_SERVIDOR}/api/admin/user/delete`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioId })
                });

                if (res.ok) {
                    cargarUsuarios();
                } else {
                    const data = await res.json();
                    alert(data.error || "No se pudo eliminar el usuario.");
                }
            } catch (e) {
                alert("Error de conexión al intentar eliminar el usuario.");
            }
        }
    </script>
